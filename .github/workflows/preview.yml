# Previews por PR con rama Neon efímera (Brief 02, bloque 13). Requiere los secretos del repo
# NEON_API_KEY, NEON_PROJECT_ID, VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID. Si falta alguno
# y el PR no viene de un fork, el job falla con un aviso; en un PR de fork (sin acceso a secretos)
# se salta sin fallar.
# La contraseña de opai_app NO es un secreto del repo: en Neon los roles son por rama, así que
# cada rama de preview recibe una contraseña aleatoria propia (no toca main ni dev).
name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rama-neon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # solo para saber si un PR huérfano ya está cerrado
    env:
      RAMA: preview/pr-${{ github.event.pull_request.number }}
      RAMA_GIT: ${{ github.head_ref }}
      ES_FORK: ${{ github.event.pull_request.head.repo.fork }}
      VERCEL_CLI: vercel@65.3.1
      NEONCTL: neonctl@8.12.1
    steps:
      - name: ¿Hay secretos?
        id: listo
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          faltan=""
          for n in NEON_API_KEY NEON_PROJECT_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!n}" ] || faltan="$faltan $n"
          done
          if [ -z "$faltan" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ "$ES_FORK" = "true" ]; then
            echo "PR de fork: sin acceso a secretos, se omite la preview."
            exit 0
          fi
          echo "::warning::Faltan secretos de preview:$faltan. Configúralos en el repo (gh secret set)."
          exit 1
      - uses: actions/checkout@v4
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
      - uses: pnpm/action-setup@v4
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
      - uses: actions/setup-node@v4
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Borrar ramas Neon huérfanas (PR ya cerrado)
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_ACTUAL: ${{ github.event.pull_request.number }}
        run: |
          # Plan con tope de 10 ramas. Solo se consideran nombres exactos preview/pr-N; main, dev y
          # pre-* nunca coinciden. Una rama se borra únicamente si GitHub confirma su PR como cerrado.
          ramas=$(npx --yes "$NEONCTL" branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r '.[].name')
          for nombre in $ramas; do
            [[ "$nombre" =~ ^preview/pr-([0-9]+)$ ]] || continue
            n="${BASH_REMATCH[1]}"
            [ "$n" != "$PR_ACTUAL" ] || continue
            estado=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${n}" --jq .state) || { echo "No se pudo leer el PR $n; se conserva $nombre."; continue; }
            if [ "$estado" = "closed" ]; then
              echo "Borrando rama huérfana $nombre (PR $n cerrado)."
              # Limpieza oportunista: otro PR pudo borrarla antes (404) o Neon fallar un momento.
              # Nada de esto debe poner en rojo este PR; si de verdad no hay cupo, falla la creación.
              if ! salida=$(npx --yes "$NEONCTL" branches delete "$nombre" --project-id "$NEON_PROJECT_ID" 2>&1); then
                if echo "$salida" | grep -qiE 'not found|404'; then
                  echo "La rama $nombre ya no existe."
                else
                  # El error de neonctl es texto libre: se escapa como piden los comandos de workflow
                  # (% CR LF) para que sus saltos de línea o un "::" no inyecten otros comandos.
                  salida=${salida//'%'/'%25'}
                  salida=${salida//$'\r'/'%0D'}
                  salida=${salida//$'\n'/'%0A'}
                  echo "::warning::No se pudo borrar la rama huérfana $nombre: $salida"
                fi
              fi
            fi
          done
      - name: Crear o reutilizar la rama Neon
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ env.RAMA }}
          parent_branch: main
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Migrar la rama
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm install --frozen-lockfile
          DATABASE_URL_MIGRATE="$DB_URL" pnpm db:deploy
      - name: Contraseña propia de opai_app y DATABASE_URL de la preview
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
          DB_HOST_POOLED: ${{ steps.neon.outputs.db_host_pooled }}
          RAMA_CREADA: ${{ steps.neon.outputs.created }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Si la rama Neon ya existía, NO se rota la contraseña de opai_app: rotarla deja a las
          # previews ya desplegadas con una clave vieja (P1000) hasta el redespliegue. Se conserva
          # solo si la DATABASE_URL de esta rama de Git apunta a esta rama Neon y la clave funciona.
          if [ "$RAMA_CREADA" != "true" ]; then
            ARCHIVO=$(mktemp)
            trap 'rm -f "$ARCHIVO"' EXIT
            if npx --yes "$VERCEL_CLI" env pull "$ARCHIVO" --environment=preview --git-branch="$RAMA_GIT" --yes >/dev/null 2>&1; then
              ACTUAL=$(sed -nE 's/^DATABASE_URL="?([^"]*)"?$/\1/p' "$ARCHIVO" | head -n1)
              if [ -n "$ACTUAL" ]; then
                echo "::add-mask::$ACTUAL"
                if [[ "$ACTUAL" == *"@${DB_HOST_POOLED}"* ]] && timeout 20 psql "$ACTUAL" -tAc 'select 1' >/dev/null 2>&1; then
                  echo "Rama Neon reutilizada y DATABASE_URL vigente: se conserva la contraseña de opai_app."
                  exit 0
                fi
              fi
            fi
            echo "Rama Neon reutilizada sin una DATABASE_URL válida para $RAMA_GIT: se fija una contraseña nueva."
          fi
          # Hex: sin caracteres que rompan la URL. La clave solo vive en este paso y en Vercel.
          CLAVE=$(openssl rand -hex 32)
          echo "::add-mask::$CLAVE"
          DATABASE_URL_MIGRATE="$DB_URL" OPAI_APP_DB_PASSWORD="$CLAVE" pnpm --filter @opai/db role:password
          # La app usa opai_app (sin BYPASSRLS) con la contraseña propia de la rama.
          URL_APP=$(echo "$DB_URL_POOLED" | sed -E "s#://[^:]+:[^@]+@#://opai_app:${CLAVE}@#")
          echo "::add-mask::$URL_APP"
          # Solo se tolera que la variable no exista todavía; cualquier otro error falla.
          if ! salida=$(npx --yes "$VERCEL_CLI" env rm DATABASE_URL preview "$RAMA_GIT" --yes 2>&1); then
            echo "$salida" | grep -qiE 'not found|no existing' || { echo "$salida"; exit 1; }
          fi
          printf '%s' "$URL_APP" | npx --yes "$VERCEL_CLI" env add DATABASE_URL preview "$RAMA_GIT" >/dev/null
      - name: Redesplegar la preview con la base de su rama
        if: steps.listo.outputs.ok == 'true' && github.event.action != 'closed'
        # El despliegue automático de Vercel pudo partir antes de fijar la variable: se repite. Se
        # redespliega el despliegue de Git de ESTE commit (vercel redeploy conserva su rama), para
        # que tome la DATABASE_URL de la rama del PR. Un `vercel deploy` desde el checkout (merge
        # ref, HEAD suelto) no queda atado a la rama y toma las variables de preview genéricas.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          URL=""
          for intento in $(seq 1 30); do
            URL=$(npx --yes "$VERCEL_CLI" ls -m githubCommitSha="$SHA" 2>&1 | grep -oE 'https://[A-Za-z0-9.-]+\.vercel\.app' | head -n1 || true)
            [ -n "$URL" ] && break
            echo "Esperando el despliegue de Git de $SHA ($intento/30)."
            sleep 10
          done
          if [ -z "$URL" ]; then
            echo "::error::No apareció el despliegue de Vercel del commit $SHA; no se redespliega para no usar la base equivocada."
            exit 1
          fi
          npx --yes "$VERCEL_CLI" redeploy "$URL" --target preview >/dev/null
      - name: Borrar la rama Neon y la variable al cerrar
        if: steps.listo.outputs.ok == 'true' && github.event.action == 'closed'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Un error real se ve y falla; solo se tolera que el recurso ya no exista (404).
          if ! salida=$(npx --yes "$NEONCTL" branches delete "$RAMA" --project-id "$NEON_PROJECT_ID" 2>&1); then
            echo "$salida"
            echo "$salida" | grep -qiE 'not found|404' || exit 1
            echo "La rama Neon $RAMA ya no existe."
          fi
          if ! salida=$(npx --yes "$VERCEL_CLI" env rm DATABASE_URL preview "$RAMA_GIT" --yes 2>&1); then
            echo "$salida"
            echo "$salida" | grep -qiE 'not found|no existing' || exit 1
            echo "La variable DATABASE_URL de $RAMA_GIT ya no existe."
          fi
