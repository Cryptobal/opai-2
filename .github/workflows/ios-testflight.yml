# CAR-733 · Build iOS de @opai/movil y subida a TestFlight (solo manual; no revisión App Store).
name: iOS · TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/movil/**'
      - '.github/scripts/ios-testflight.sh'
      - '.github/scripts/ios_testflight_que_probar.py'
      - '.github/workflows/ios-testflight.yml'

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  # Si Apple rechaza el SDK, sube la versión (consulta xcodebuild -version en macos-15).
  XCODE_VERSION: latest-stable
  IOS_SDK_MIN_MAJOR: "18"

jobs:
  testflight:
    name: compilar y subir · TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Comprobar secretos obligatorios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          faltan=()
          [ -z "${ASC_KEY_ID:-}" ] && faltan+=(ASC_KEY_ID)
          [ -z "${ASC_ISSUER_ID:-}" ] && faltan+=(ASC_ISSUER_ID)
          [ -z "${ASC_KEY_P8:-}" ] && faltan+=(ASC_KEY_P8)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos en GitHub Actions: ${faltan[*]}. Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Sincronizar Capacitor (test)
        run: pnpm --filter @opai/movil sincronizar

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Compilar, verificar entitlements y subir a TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          IOS_SDK_MIN_MAJOR: ${{ env.IOS_SDK_MIN_MAJOR }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "::add-mask::$ASC_ISSUER_ID"
          bash .github/scripts/ios-testflight.sh

      - name: Etiqueta ios-build (si «Qué probar» OK)
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          marcador="${RUNNER_TEMP}/opai-ios-testflight/que-probar-ok"
          if [ ! -f "$marcador" ]; then
            echo "::warning::Sin «Qué probar» en ASC; no se crea tag ios-build."
            exit 0
          fi
          bn="${BUILD_NUMBER:?}"
          tag="ios-build-${bn}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} ya existe; se omite."
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"