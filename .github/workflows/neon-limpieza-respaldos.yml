# Ramas Neon de respaldo y previews archivadas de más de N días (CAR-629). Solo **lista** candidatas
# a limpieza manual; nunca borra. No toca main, dev ni preview/pr-N de PR abiertos.
name: Neon · limpieza de respaldos

on:
  schedule:
    # 06:00 America/Santiago (UTC−3) ≈ 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: Antigüedad mínima en días para listar
        type: number
        default: 7

permissions:
  contents: read
  pull-requests: read

jobs:
  listar:
    name: neon · candidatas limpieza
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      NEONCTL: neonctl@8.12.1
    steps:
      - name: ¿Hay secretos?
        id: listo
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          for n in NEON_API_KEY NEON_PROJECT_ID; do
            [ -n "${!n}" ] || { echo "::error::Falta $n"; exit 1; }
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.listo.outputs.ok == 'true'
      - name: Listar ramas antiguas (sin borrar)
        if: steps.listo.outputs.ok == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
          DIAS: ${{ inputs.dias || 7 }}
        run: .github/scripts/neon-limpieza-respaldos.sh