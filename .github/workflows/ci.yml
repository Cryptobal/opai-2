name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: ningún job necesita escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · test · test:db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runner estándar ~7 GB: muchos `tsc` en paralelo vía Turbo agotan RAM (p. ej. @opai/capabilities ~2,8 GB).
    env:
      TURBO_CACHE_DIR: .turbo
      NODE_OPTIONS: --max-old-space-size=4096
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Ampliar swap (runner ~7 GB)
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Restaurar caché de Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck -- --concurrency=1
      - run: pnpm lint -- --concurrency=1
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opai_test

  presupuesto:
    name: build · presupuesto de JS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Variables ficticias: el build no se conecta a la base ni envía correos (ADR-037).
      - run: pnpm --filter @opai/web build
        env:
          DATABASE_URL: postgresql://opai_app:ficticia@localhost:5432/opai
          BETTER_AUTH_SECRET: ficticio-solo-para-build-de-ci-000000000000
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
          # El chequeo de tipos de `next build` supera el heap por defecto (~2 GB) desde fines de octubre.
          NODE_OPTIONS: --max-old-space-size=5120
      - run: pnpm presupuesto

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks con versión y suma fijas; no necesita secretos de CI (AGENTS.md: sin secretos en el código).
      - name: Instalar gitleaks 8.24.0
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Escanear la historia del repositorio (pull_request)
        if: github.event_name == 'pull_request'
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
      - name: Escanear la historia del repositorio (push)
        if: github.event_name == 'push'
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="${{ github.sha }}" .

  e2e:
    name: e2e · shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opai_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Base efímera del propio job (servicio de Postgres): no hay secretos del repositorio ni de Neon.
      # La URL del rol propietario (DATABASE_URL_MIGRATE) solo existe en el paso de migrar y sembrar:
      # la app y los e2e corren únicamente con `opai_app`, como en producción.
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Credenciales inventadas para esta ejecución; viven solo en el job y se enmascaran en el log.
      # RONDAS_ETIQUETA_SECRET es obligatoria desde la corrección de la review 5713377140 del PR #145
      # (sin respaldo a BETTER_AUTH_SECRET): sin ella, crear un punto QR en e2e fallaría cerrado.
      - name: Generar credenciales efímeras
        run: |
          for var in OPAI_APP_DB_PASSWORD BETTER_AUTH_SECRET CRON_SECRET RONDAS_ETIQUETA_SECRET; do
            valor=$(openssl rand -hex 24)
            echo "::add-mask::$valor"
            echo "$var=$valor" >> "$GITHUB_ENV"
          done
          clave="$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$clave"
          echo "SEED_OWNER_PASSWORD=$clave" >> "$GITHUB_ENV"
      - name: Migrar y sembrar la base
        env:
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/opai_e2e
        run: |
          pnpm db:deploy
          pnpm --filter @opai/db role:password
          echo "DATABASE_URL=postgresql://opai_app:${OPAI_APP_DB_PASSWORD}@localhost:5432/opai_e2e" >> "$GITHUB_ENV"
          pnpm --filter @opai/db seed:dev-tenant
          pnpm --filter @opai/auth seed:platform-owner
          SEED_PLATFORM_ROLE=ninguno SEED_OWNER_EMAIL=e2e-multiempresa@opai.cl pnpm --filter @opai/auth seed:platform-owner
          pnpm --filter @opai/db seed:e2e
          pnpm --filter @opai/db seed:maestros-demo
          pnpm --filter @opai/db exec tsx scripts/fixture-vencimientos-e2e.ts
          # Fixture de Pauta (CAR-81): instalación ficticia, dos puestos y dos personas; activa el módulo.
          # `DATABASE_URL` se exporta a GITHUB_ENV y no rige dentro de este mismo paso: la fixture escribe
          # con el rol de la app (RLS) y la pasa explícita.
          DATABASE_URL="postgresql://opai_app:${OPAI_APP_DB_PASSWORD}@localhost:5432/opai_e2e" pnpm --filter @opai/db seed:pauta-e2e
          # Usuario con dos empresas para selector-riel.spec.ts (selector de portal y empresa en iPad).
          pnpm --filter @opai/auth seed:multiempresa-e2e
          # Admin y owner también requieren MFA; conservar los mismos roles de los fixtures.
          SEED_OWNER_EMAIL=e2e-selector@opai.cl pnpm --filter @opai/auth seed:e2e-mfa
          SEED_OWNER_EMAIL=e2e-multiempresa@opai.cl pnpm --filter @opai/auth seed:e2e-mfa
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @opai/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Restaurar Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium
      - name: Instalar dependencias del sistema
        run: pnpm --filter @opai/web exec playwright install-deps chromium
      - name: Instalar Chromium de Playwright
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @opai/web exec playwright install chromium
      # Las páginas /ds solo existen fuera de producción: se levanta `pnpm dev`. La primera visita de
      # cada ruta la compila, así que se calientan antes de que corran los e2e (sin tocar las pruebas).
      - name: Levantar la app y calentar las rutas
        run: |
          nohup pnpm --filter @opai/web dev > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -m 10 http://localhost:3000/api/health > /dev/null && break; sleep 2; done
          curl -sf -m 10 http://localhost:3000/api/health
          for ruta in /login /ds /ds/qa /ds/acceso / /platform /cuentas /instalaciones /personas /configuracion/usuarios; do
            curl -s -o /dev/null -m 120 "http://localhost:3000$ruta" || true
          done
      - name: Correr los e2e
        timeout-minutes: 25
        run: pnpm --filter @opai/web e2e --shard=${{ matrix.shard }}/6 --reporter=list,blob
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/opai_e2e
      - name: Guardar evidencias del shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/blob-report
            ${{ runner.temp }}/app.log
          retention-days: 7

  e2e-informe:
    name: e2e · informe
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: artefactos
      - name: Combinar informes disponibles
        run: |
          mkdir -p blobs
          find artefactos -path '*/blob-report/*.zip' -exec cp {} blobs/ \;
          test -n "$(ls -A blobs)"
          pnpm --filter @opai/web exec playwright merge-reports --reporter=html,github "$GITHUB_WORKSPACE/blobs"
      - name: Guardar informe HTML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-informe-html
          path: apps/web/playwright-report
          retention-days: 7

  e2e-check:
    name: e2e (Playwright)
    needs: [e2e, e2e-informe]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar shards e informe
        env:
          SHARDS: ${{ needs.e2e.result }}
          INFORME: ${{ needs.e2e-informe.result }}
        run: test "$SHARDS" = success && test "$INFORME" = success

  rendimiento:
    name: rendimiento
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opai_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # Gate estricto (ADR-045): las metas fallan el job, no solo informan.
      # Corre en CI; no es check obligatorio del ruleset «Proteger main» (25783585).
      GATE_ESTRICTO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generar credenciales efímeras
        run: |
          for var in OPAI_APP_DB_PASSWORD BETTER_AUTH_SECRET CRON_SECRET; do
            valor=$(openssl rand -hex 24)
            echo "::add-mask::$valor"
            echo "$var=$valor" >> "$GITHUB_ENV"
          done
          clave="$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$clave"
          echo "SEED_OWNER_PASSWORD=$clave" >> "$GITHUB_ENV"
      - name: Migrar y sembrar la base
        env:
          DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/opai_e2e
        run: |
          pnpm db:deploy
          pnpm --filter @opai/db role:password
          echo "DATABASE_URL=postgresql://opai_app:${OPAI_APP_DB_PASSWORD}@localhost:5432/opai_e2e" >> "$GITHUB_ENV"
          pnpm --filter @opai/db seed:dev-tenant
          pnpm --filter @opai/auth seed:platform-owner
          pnpm --filter @opai/db seed:e2e
          pnpm --filter @opai/db seed:maestros-demo
      # El build no se conecta a la base (ADR-037); la app lee DATABASE_URL al arrancar.
      - name: Construir la app (producción)
        run: pnpm --filter @opai/web build
        env:
          NODE_OPTIONS: --max-old-space-size=5120
      - name: Instalar Chromium de Playwright
        run: pnpm --filter @opai/web exec playwright install --with-deps chromium
      - name: Levantar la app (next start) y calentar las rutas del protocolo
        run: |
          nohup pnpm --filter @opai/web start > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf -m 10 http://localhost:3000/api/health > /dev/null && break; sleep 2; done
          curl -sf -m 10 http://localhost:3000/api/health
          for ruta in /login / /cuentas /instalaciones /personas /cargos /configuracion; do
            curl -s -o /dev/null -m 120 "http://localhost:3000$ruta" || true
          done
      - name: Correr el gate de rendimiento (estricto)
        run: pnpm --filter @opai/web e2e rendimiento --project=telefono --reporter=list
        env:
          BASE_URL: http://localhost:3000
      - name: Guardar resultados si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendimiento-resultados
          path: |
            apps/web/test-results
            ${{ runner.temp }}/app.log
          retention-days: 7
