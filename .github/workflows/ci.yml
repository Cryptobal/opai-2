name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · test · test:db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opai_test

  presupuesto:
    name: build · presupuesto de JS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Variables ficticias: el build no se conecta a la base ni envía correos (ADR-037).
      - run: pnpm --filter @opai/web build
        env:
          DATABASE_URL: postgresql://opai_app:ficticia@localhost:5432/opai
          BETTER_AUTH_SECRET: ficticio-solo-para-build-de-ci-000000000000
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm presupuesto
