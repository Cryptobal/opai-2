name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: ningún job necesita escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · lint · test · test:db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/opai_test

  presupuesto:
    name: build · presupuesto de JS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Variables ficticias: el build no se conecta a la base ni envía correos (ADR-037).
      - run: pnpm --filter @opai/web build
        env:
          DATABASE_URL: postgresql://opai_app:ficticia@localhost:5432/opai
          BETTER_AUTH_SECRET: ficticio-solo-para-build-de-ci-000000000000
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm presupuesto

  secretos:
    name: secretos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks con versión y suma fijas; no necesita secretos de CI (AGENTS.md: sin secretos en el código).
      - name: Instalar gitleaks 8.24.0
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Escanear la historia del repositorio
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
