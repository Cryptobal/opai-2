<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
<script src="fin-shell.js"></script>
<style>body{margin:0}a{color:var(--ds-accent)}a:hover{color:var(--ds-fg)}</style>
</helmet>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ nav.tabs }}" groups="{{ nav.groups }}" active="{{ nav.active }}" title="{{ shellTitle }}" tenant="Atlas Seguridad SpA" tenant-initials="AS" width="100%" height="100%" hint-size="100%,100%">
<sc-if value="{{ notForbidden }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" tab-bar="{{ isPhone }}" hint-size="100%,600px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PageHeader" eyebrow="Proveedores" title="{{ headTitle }}" subtitle="{{ headSub }}" badge="{{ headBadge }}" hint-size="100%,80px">
<sc-if value="{{ isDatos }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Button" variant="secondary" hint-size="120px,40px">Editar</x-import>
</sc-if>
</x-import>
<sc-if value="{{ isDatos }}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PatternGrid" cols="{{ 2 }}" phone="{{ 2 }}" gap="{{ 12 }}" hint-size="100%,104px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.KpiTile" label="Por pagar" value="$ 2.380.000" delta="1 factura" hint-size="100%,104px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.KpiTile" label="Pago real promedio" value="27 días" delta="plazo pactado 30 días" direction="down" tone="success" hint-size="100%,104px"></x-import>
</x-import>
<sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Tabs" items="{{ phoneTabs }}" value="{{ tab }}" on-change="{{ setTab }}" hint-size="100%,44px"></x-import>
</sc-if>
<sc-if value="{{ showDatos }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PatternGrid" cols="{{ 2 }}" phone="{{ 1 }}" gap="{{ 16 }}" hint-size="100%,260px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" title="Datos" hint-size="100%,260px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.DetailSection" rows="{{ datosRows }}" hint-size="100%,200px"></x-import>
</x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" title="Por defecto en cada compra" description="Se proponen al recibir un DTE de este proveedor" hint-size="100%,260px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.DetailSection" rows="{{ defRows }}" hint-size="100%,200px"></x-import>
</x-import>
</x-import>
</sc-if>
<sc-if value="{{ notPhone }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Tabs" items="{{ deskTabs }}" value="{{ deskTab }}" on-change="{{ setTab }}" hint-size="100%,44px"></x-import>
</sc-if>
<sc-if value="{{ showCompras }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" dc-props="{{ tblProps }}" columns="{{ compCols }}" rows="{{ compras }}" cards="{{ isPhone }}" to-card="{{ compCard }}" on-row-click="{{ noop }}" hint-size="100%,280px"></x-import>
</sc-if>
<sc-if value="{{ showPagos }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" dc-props="{{ tblProps }}" columns="{{ pagoCols }}" rows="{{ pagos }}" cards="{{ isPhone }}" to-card="{{ pagoCard }}" hint-size="100%,280px"></x-import>
<p class="t-caption" style="margin:0">Cada pago es un cargo bancario conciliado con una o más facturas. La glosa se muestra tal como la envía el banco.</p>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ isCargando }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:16px" aria-busy="true" aria-label="Cargando proveedor">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<sc-for list="{{ sk3 }}" as="s" hint-placeholder-count="3"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="100%" height="104px" radius="{{ 16 }}" hint-size="100%,104px"></x-import></sc-for>
</div>
<div style="border:1px solid var(--ds-border);border-radius:var(--radius-lg);background:var(--ds-surface);padding:16px;display:flex;flex-direction:column;gap:14px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="120px" height="18px" hint-size="120px,18px"></x-import>
<sc-for list="{{ sk5 }}" as="s" hint-placeholder-count="5"><div style="display:flex;justify-content:space-between;gap:16px"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="30%" height="14px" hint-size="30%,14px"></x-import><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="40%" height="14px" hint-size="40%,14px"></x-import></div></sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isVacio }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Empty" icon="briefcase" title="Este proveedor aún no tiene compras" description="Las compras aparecen cuando llega un DTE suyo por RCV. Define desde ya su plazo de pago y su cuenta por defecto." action="{{ emptyAction }}" hint-size="100%,320px"></x-import>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.ErrorState" title="No pudimos cargar la ficha del proveedor" description="Revisa tu conexión. Si el problema sigue, avísale a soporte con el código." code="FIN-PRO-504" on-retry="{{ noop }}" hint-size="100%,320px"></x-import>
</sc-if>
</x-import>
</sc-if>
<sc-if value="{{ isForbidden }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Forbidden" title="{{ fb.title }}" description="{{ fb.description }}" action-label="Pedir acceso" hint-size="100%,100%"></x-import>
</sc-if>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;datos&quot;,&quot;vacio&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinPermiso&quot;],&quot;default&quot;:&quot;datos&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { tab: null };
  componentDidMount() { if (!window.FinShell) { const t = setInterval(() => { if (window.FinShell) { clearInterval(t); this.forceUpdate(); } }, 40); } }
  renderVals() {
    const F = window.FinShell;
    const h = React.createElement;
    const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const device = this.props.device ?? "desktop";
    const isPhone = device === "phone";
    const st = F ? F.estado(this.props) : { isDatos: true, notForbidden: true };
    const badge = (t, l) => (NS.Badge ? h(NS.Badge, { tone: t }, l) : l);
    const mono = (t) => h("span", { className: "t-mono" }, t);
    const tab = this.state.tab ?? (isPhone ? "datos" : "compras");
    const compras = [
      { id: 1, folio: "33 · 18452", fecha: "14-10-2026", cc: "Sin centro de costo", monto: "$ 2.380.000", pago: ["neutral", "Pendiente"], vence: "13-11-2026" },
      { id: 2, folio: "33 · 18101", fecha: "16-09-2026", cc: "Planta Quilicura", monto: "$ 1.940.000", pago: ["success", "Pagada"], vence: "16-10-2026" },
      { id: 3, folio: "33 · 17760", fecha: "18-08-2026", cc: "Planta Quilicura", monto: "$ 2.115.500", pago: ["success", "Pagada"], vence: "17-09-2026" },
      { id: 4, folio: "33 · 17412", fecha: "21-07-2026", cc: "Bodega Lampa", monto: "$ 860.000", pago: ["success", "Pagada"], vence: "20-08-2026" },
    ];
    const pagos = [
      { id: 1, fecha: "13-10-2026", glosa: "TRANSF A 78234567-1 UNIFORMES PACIF", cuenta: "Banco de Chile · 0012", facturas: "33 · 18101", monto: "$ 1.940.000" },
      { id: 2, fecha: "15-09-2026", glosa: "TRANSF A 78234567-1 UNIFORMES PACIF", cuenta: "Banco de Chile · 0012", facturas: "33 · 17760", monto: "$ 2.115.500" },
      { id: 3, fecha: "19-08-2026", glosa: "PAGO PROV 78234567 OC 2207", cuenta: "Banco de Chile · 0012", facturas: "33 · 17412", monto: "$ 860.000" },
    ];
    return {
      tblProps: { style: { display: "block" } }, device, theme: this.props.theme ?? "light", isPhone, notPhone: !isPhone, ...st,
      nav: F ? F.shell("pro", device) : { tabs: [], groups: [] },
      fb: F ? F.forbidden : {},
      shellTitle: isPhone ? "" : "Finanzas",
      headTitle: "Uniformes Pacífico Ltda",
      headSub: h("span", null, mono("78.234.567-1"), " · Vestuario y EPP"),
      headBadge: st.isDatos ? badge("success", "Activo") : null,
      tab, setTab: (v) => this.setState({ tab: v }),
      phoneTabs: [{ id: "datos", label: "Datos" }, { id: "compras", label: "Compras", count: 4 }, { id: "pagos", label: "Pagos", count: 3 }],
      deskTabs: [{ id: "compras", label: "Compras", count: 4 }, { id: "pagos", label: "Pagos", count: 3 }],
      deskTab: tab === "datos" ? "compras" : tab,
      showDatos: !isPhone || tab === "datos",
      showCompras: isPhone ? tab === "compras" : tab !== "pagos",
      showPagos: tab === "pagos",
      sk3: [1, 2, 3], sk5: [1, 2, 3, 4, 5], noop: () => {},
      datosRows: [
        { label: "Razón social", value: "Uniformes Pacífico Limitada" },
        { label: "RUT", value: "78.234.567-1", mono: true },
        { label: "Giro", value: "Confección de ropa de trabajo" },
        { label: "Correo de facturación", value: "facturacion@uniformespacifico.cl" },
        { label: "Dirección", value: "Av. Matta 1240, Santiago" },
      ],
      defRows: [
        { label: "Plazo de pago", value: "30 días desde la emisión" },
        { label: "Cuenta de gasto", value: h("span", null, mono("5.1.04"), " Uniformes y EPP") },
        { label: "Centro de costo", value: "Planta Quilicura" },
        { label: "Cuenta bancaria", value: h("span", null, "Banco Estado · ", mono("0123-4567-89")) },
      ],
      emptyAction: NS.Button ? h(NS.Button, { variant: "secondary" }, "Editar condiciones") : null,
      compCols: [
        { key: "folio", label: "Tipo · folio", mono: true },
        { key: "fecha", label: "Emisión", muted: true },
        { key: "cc", label: "Centro de costo", render: (r) => r.cc === "Sin centro de costo" ? badge("warning", r.cc) : r.cc },
        { key: "vence", label: "Vence", muted: true },
        { key: "monto", label: "Monto", align: "right", render: (r) => h("span", { className: "t-numeric" }, r.monto) },
        { key: "pago", label: "Estado de pago", render: (r) => badge(r.pago[0], r.pago[1]) },
      ],
      compCard: (r) => ({ title: r.folio, subtitle: r.fecha + " · " + r.cc, badge: { tone: r.pago[0], label: r.pago[1] }, trailing: h("span", { className: "t-numeric", style: { fontSize: 14 } }, r.monto) }),
      pagoCols: [
        { key: "fecha", label: "Fecha", muted: true },
        { key: "glosa", label: "Glosa del banco", render: (r) => h("span", { className: "t-mono" }, r.glosa) },
        { key: "cuenta", label: "Cuenta", muted: true },
        { key: "facturas", label: "Facturas", mono: true },
        { key: "monto", label: "Monto", align: "right", render: (r) => h("span", { className: "t-numeric" }, r.monto) },
      ],
      pagoCard: (r) => ({ title: r.monto, subtitle: r.fecha + " · " + r.cuenta, meta: r.glosa }),
    };
  }
}
</script>
</body>
</html>
