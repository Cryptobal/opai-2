<sc-if value="{{ notPhone }}" hint-placeholder-val="{{ true }}">

</sc-for>

<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="28%" height="{{ 12 }}" hint-size="28%,12px"></x-import>
</div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="132px" height="{{ 32 }}" radius="{{ 10 }}" hint-size="132px,32px"></x-import>
</div>
</sc-for>
</div>

</sc-if>
</x-import>
</x-import>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;vacio&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const device = this.props.device ?? "desktop";
    const estado = this.props.estado ?? "normal";
    const isPhone = device === "phone", isTablet = device === "tablet";
    const B = (tone, t) => (NS.Badge ? h(NS.Badge, { tone }, t) : t);
    const ren = () => (NS.Button ? h(NS.Button, { variant: "secondary", size: "sm", icon: "upload" }, "Subir renovación") : null);
    const g = [
      { titulo: "Vencidos", count: 2, rows: [
        { id: 1, doc: "Póliza de responsabilidad civil", ent: "Bodega Lampa", tent: "Instalación", fecha: "12-10-2026", rel: "Venció hace 18 días", tone: "danger" },
        { id: 2, doc: "Certificado de seguro de vida guardias", ent: "Logística Andina SpA", tent: "Cuenta", fecha: "25-10-2026", rel: "Venció hace 5 días", tone: "danger" },
      ] },
      { titulo: "Vencen en 30 días", count: 2, rows: [
        { id: 3, doc: "Plan de seguridad OS-10", ent: "Planta Quilicura", tent: "Instalación", fecha: "21-11-2026", rel: "En 22 días", tone: "warning" },
        { id: 4, doc: "Garantía de fiel cumplimiento", ent: "Inmobiliaria Apoquindo", tent: "Cuenta", fecha: "28-11-2026", rel: "En 29 días", tone: "warning" },
      ] },
      { titulo: "Vencen en 60 días", count: 2, rows: [
        { id: 5, doc: "Contrato de servicios", ent: "Torre Apoquindo", tent: "Instalación", fecha: "15-12-2026", rel: "En 46 días", tone: "info" },
        { id: 6, doc: "Certificado de adhesión a mutualidad", ent: "Logística Andina SpA", tent: "Cuenta", fecha: "31-12-2026", rel: "En 62 días", tone: "info" },
      ] },
    ];
    g[2].rows[1].rel = "En 60 días"; g[2].rows[1].fecha = "29-12-2026";
    const entCell = (r) => h("span", { style: { display: "flex", flexDirection: "column" } }, NS.Enlace ? h(NS.Enlace, { variante: "fila", href: "#", style: { minHeight: 0 } }, r.ent) : r.ent, h("span", { className: "t-caption" }, r.tent));
    const cols = [
      { key: "doc", label: "Documento", strong: true, width: isTablet ? undefined : "36%" },
      { key: "ent", label: "Cuenta o instalación", render: entCell },
      { key: "fecha", label: "Vence", render: (r) => h("span", { style: { display: "flex", flexDirection: "column", gap: 2, alignItems: "flex-start" } }, h("span", { className: "t-numeric" }, r.fecha), B(r.tone, r.rel)) },
      { key: "a", label: "", align: "right", render: ren },
    ];
    return {
      user: { name: "Paula Ibáñez", initials: "PI", role: "Administradora" },
      theme: this.props.theme ?? "light",
      shellDevice: isPhone ? "phone" : "desktop",
      navActive: isPhone ? "mas" : "doc",
      isPhone, notPhone: !isPhone,
      groupGap: isPhone ? "8px" : "24px",
      grupos: g, cols,
      toCard: (r) => ({ icon: "file", title: r.doc, subtitle: r.ent + " · " + r.fecha, badge: { tone: r.tone, label: r.rel }, trailing: NS.IconButton ? h(NS.IconButton, { icon: "upload", label: "Subir renovación de " + r.doc }) : null }),
      isNormal: estado === "normal", isLoading: estado === "cargando", isEmpty: estado === "vacio", isError: estado === "error",
      isForbidden: estado === "sinpermiso", notForbidden: estado !== "sinpermiso",
      emptyAction: NS.Button ? h(NS.Button, { variant: "secondary", size: "lg" }, "Ver explorador") : null,
      skel: [{ w: "46%" }, { w: "38%" }, { w: "52%" }, { w: "34%" }, { w: "44%" }],
      docTabs: [{ id: "exp", label: "Explorador" }, { id: "ven", label: "Vencimientos" }, { id: "pla", label: "Plantillas" }, { id: "fir", label: "Firmas pendientes" }],
      tabs: [{ id: "ini", label: "Inicio", icon: "home" }, { id: "neg", label: "Negocios", icon: "briefcase" }, { id: "pau", label: "Pauta", icon: "calendar" }, { id: "mas", label: "Más", icon: "more" }],
      groups: [
        { items: [{ id: "ini", label: "Inicio", icon: "home" }] },
        { title: "Comercial", items: [] }, { title: "Clientes", items: [] }, { title: "Operaciones", items: [] }, { title: "Personas", items: [] },
        { items: [{ id: "doc", label: "Documentos", icon: "file" }] },
        { items: [{ id: "cfg", label: "Configuración", icon: "grid" }] },
      ],
    };
  }
}
</script>
