<!DOCTYPE html>

<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ shellDevice }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" user="{{ user }}" active="{{ navActive }}" title="" width="100%" height="100%" hint-size="100%,100%">

class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;

    const device = this.props.device ?? "desktop";

    const fir = { no: ["neutral", "Sin firma"], pen: ["info", "Pendiente"], ok: ["success", "Firmado"] };
    const rows = [
      { id: 1, nombre: "Póliza de responsabilidad civil", vinc: "Bodega Lampa", ent: "Instalación", tipo: "Póliza", vence: "12-10-2026", v: "ven", f: "no", por: "María José Rivas", fecha: "03-01-2026" },

      { id: 7, nombre: "Recepción de uniforme y EPP", vinc: "Diego Silva", ent: "Persona", tipo: "Recepción", vence: "", v: "sin", f: "ok", por: "Jorge Muñoz", fecha: "20-10-2026" },

    if (isTablet) cols = cols.filter((c) => c.key !== "por" && c.key !== "tipo" && c.key !== "fecha");
