<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<div data-theme="{{ theme }}" style="min-height:100%;background:var(--ds-bg);padding:24px 16px;box-sizing:border-box">
<div style="max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px">
<div><div style="font:500 12px/16px var(--font-sans);color:var(--ds-fg-muted)">Control de acceso</div>
<div style="font:600 28px/34px var(--font-sans);color:var(--ds-fg)">Vista por rol</div></div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" padding="{{ 0 }}" hint-size="100%,500px">
<div style="overflow-x:auto">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ rows }}" hint-size="100%,420px"></x-import>
</div>
</x-import>
<div style="font:400 13px/18px var(--font-sans);color:var(--ds-fg-muted)">Supervisor: solo instalaciones a su cargo; gestiona listas si su rol lo permite. Cliente: solo su cuenta; autoriza excepciones como anfitrión si la empresa lo permite. Dispositivo de Terreno: solo su instalación y el día en curso.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement; const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const c = (v) => (r) => { const x = r[v]; const t = x === "Sí" ? "success" : x === "No" ? "neutral" : "info"; return NS.Badge ? h(NS.Badge, { tone: t }, x) : x; };
    const keys = [["ver", "Ver registros"], ["reg", "Registrar"], ["lis", "Listas"], ["exc", "Excepciones"], ["pre", "Prerregistrar"], ["doc", "Ver documento"], ["exp", "Exportar"], ["cfg", "Configurar"]];
    const S = "Sí", N = "No", P = "Parcial";
    const rows = [
      { rol: "Owner", ver: S, reg: S, lis: S, exc: S, pre: S, doc: S, exp: S, cfg: S },
      { rol: "Administrador", ver: S, reg: S, lis: S, exc: S, pre: S, doc: S, exp: S, cfg: S },
      { rol: "Gerente", ver: S, reg: S, lis: S, exc: S, pre: S, doc: P, exp: P, cfg: N },
      { rol: "Supervisor", ver: P, reg: P, lis: P, exc: P, pre: P, doc: P, exp: N, cfg: N },
      { rol: "Visualizador", ver: S, reg: N, lis: N, exc: N, pre: N, doc: N, exp: N, cfg: N },
      { rol: "Cliente (portal)", ver: P, reg: N, lis: P, exc: P, pre: S, doc: N, exp: N, cfg: N },
      { rol: "Dispositivo de Terreno", ver: P, reg: P, lis: N, exc: N, pre: N, doc: N, exp: N, cfg: N },
    ];
    return { theme: this.props.theme ?? "light", rows, cols: [{ key: "rol", label: "Rol", render: (r) => h("span", { style: { fontWeight: 500 } }, r.rol) }, ...keys.map(([k, l]) => ({ key: k, label: l, render: c(k) }))] };
  }
}
</script>
</body>
</html>
