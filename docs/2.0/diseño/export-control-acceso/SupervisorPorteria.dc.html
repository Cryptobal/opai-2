<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" active="por" title="{{ shellTitle }}" tenant="Atlas Seguridad SpA" tenant-initials="AS" width="100%" height="100%" hint-size="100%,100%">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" hint-size="100%,600px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PageHeader" eyebrow="Operaciones › Accesos" title="Portería" subtitle="Resumen de tus 3 instalaciones · hoy 30-10-2026" hint-size="100%,80px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Alerta" tono="info" titulo="Decide Carlos · Por confirmar D4" style="margin-bottom:16px" hint-size="100%,72px">Falta definir si este resumen vive en el modo supervisor de Terreno o en el ERP. Aquí se dibuja en el ERP.</x-import>
<dc-import name="EstadoPanel" estado="{{ estado }}" empty-title="Sin novedades en tus instalaciones" empty-desc="No hay intentos denegados ni dispositivos desconectados." hint-size="100%,260px"></dc-import>
<sc-if value="{{ isNormal }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="display:grid;grid-template-columns:{{ kpiCols }};gap:12px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.KpiTile" label="Intentos denegados" value="3" hint-size="100%,88px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.KpiTile" label="Listas desactualizadas" value="1" hint-size="100%,88px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.KpiTile" label="Dispositivos sin conexión" value="1" hint-size="100%,88px"></x-import>
</div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Alerta" tono="warning" titulo="Lista desactualizada · Bodega Lampa" hint-size="100%,72px">La portería 2 no se sincroniza hace más de 24 h. Los ingresos se marcan «Sin validar con la lista actual».</x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" title="Excepciones y denegados" padding="{{ 0 }}" hint-size="100%,300px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ rows }}" cards="{{ isPhone }}" to-card="{{ toCard }}" on-row-click="{{ noop }}" hint-size="100%,260px"></x-import>
</x-import>
</div>
</sc-if>
</x-import>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;cargando&quot;,&quot;vacio&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement; const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const device = this.props.device ?? "desktop"; const estado = this.props.estado ?? "normal"; const ph = device === "phone";
    const rows = [{ hora: "08:21", doc: "9.1••.•••-4", inst: "Planta Quilicura", motivo: "No autorizado", tone: "warning", exc: true }, { hora: "08:03", doc: "15.0••.•••-7", inst: "Planta Quilicura", motivo: "Bloqueado", tone: "danger", exc: false }, { hora: "22:40", doc: "ABCD·12", inst: "Bodega Lampa", motivo: "Fuera de horario", tone: "warning", exc: true }];
    return {
      device, theme: this.props.theme ?? "light", isPhone: ph, shellTitle: ph ? "" : "Portería", estado, isNormal: estado === "normal", noop: () => {},
      kpiCols: ph ? "repeat(2,minmax(0,1fr))" : "repeat(3,minmax(0,1fr))",
      cols: [{ key: "hora", label: "Hora", mono: true }, { key: "doc", label: "Documento", mono: true }, { key: "inst", label: "Instalación" }, { key: "motivo", label: "Motivo", render: (r) => NS.Badge ? h(NS.Badge, { tone: r.tone }, r.motivo) : r.motivo },
        { key: "exc", label: "", render: (r) => r.exc && NS.Button ? h(NS.Button, { variant: "secondary", size: "sm" }, "Autorizar excepción") : h("span", { style: { color: "var(--ds-fg-muted)" } }, "Sin excepción") }],
      rows, toCard: (r) => ({ initials: r.hora, title: r.doc, subtitle: r.inst, meta: r.exc ? "Autorizar excepción" : "Sin excepción", badge: { tone: r.tone, label: r.motivo } }),
      tabs: [{ id: "ini", label: "Inicio", icon: "home" }, { id: "por", label: "Portería", icon: "user-check" }, { id: "per", label: "Personas", icon: "users" }, { id: "tic", label: "Tickets", icon: "ticket" }, { id: "mas", label: "Más", icon: "more" }],
      groups: [{ items: [{ id: "ini", label: "Inicio", icon: "home" }] }, { title: "Operaciones", items: [{ id: "por", label: "Portería", icon: "user-check" }] }],
    };
  }
}
</script>
</body>
</html>
