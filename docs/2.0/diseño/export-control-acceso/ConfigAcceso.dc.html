<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Campo" etiqueta="Texto del aviso" hint-size="100%,120px"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Textarea" style="width:100%" hint-size="100%,88px"></x-import></x-import>
<div><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Button" variant="secondary" icon="download" hint-size="240px,44px">Descargar cartel de privacidad</x-import></div>
</div>
</x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" title="Reportes" padding="{{ 16 }}" hint-size="100%,200px">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="display:grid;grid-template-columns:{{ cols2 }};gap:16px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Campo" etiqueta="Frecuencia" hint-size="100%,72px"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Input" value="Semanal · lunes 08:00" style="width:100%" hint-size="100%,44px"></x-import></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Campo" etiqueta="Destinatarios" hint-size="100%,72px"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Input" value="marcela.rojas@atlas.example" style="width:100%" hint-size="100%,44px"></x-import></x-import>

</sc-if>
</div>
</sc-if>
</div>
</x-import>
</x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lista&quot;,&quot;entrada&quot;],&quot;default&quot;:&quot;entrada&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const device = this.props.device ?? "desktop"; const ph = device === "phone"; const estado = this.props.estado ?? "normal";
    const vista = this.props.vista ?? "entrada";
    const mods = ["Personas", "Instalaciones", "Control de acceso", "Pauta", "Rondas", "Tickets"];
    return {
      device, theme: this.props.theme ?? "light", isPhone: ph, estado, isNormal: estado === "normal", shellTitle: ph ? "" : "Configuración",
      showList: !ph || vista === "lista", showEntrada: !ph || vista === "entrada",
      crumb: ph && vista === "entrada" ? " › Control de acceso" : "", cols: ph ? "minmax(0,1fr)" : "240px minmax(0,1fr)", cols2: ph ? "minmax(0,1fr)" : "repeat(2,minmax(0,1fr))",
      modulos: mods.map((n) => ({ nombre: n, bg: n === "Control de acceso" && !ph ? "var(--ds-fill)" : "transparent" })),
      ambitos: ["Empresa", "Planta Quilicura", "Bodega Lampa", "Torre Apoquindo"], modos: ["Solo listas", "Registro manual"],
      tabs: [{ id: "ini", label: "Inicio", icon: "home" }, { id: "acc", label: "Accesos", icon: "user-check" }, { id: "per", label: "Personas", icon: "users" }, { id: "tic", label: "Tickets", icon: "ticket" }, { id: "mas", label: "Más", icon: "more" }],
      groups: [{ items: [{ id: "ini", label: "Inicio", icon: "home" }] }, { title: "Operaciones", items: [{ id: "acc", label: "Accesos", icon: "user-check" }] }, { title: "Administración", items: [{ id: "cfg", label: "Configuración", icon: "settings" }] }],
    };
  }
}
</script>
</body>
</html>
