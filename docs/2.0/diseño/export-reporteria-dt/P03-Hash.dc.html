<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/icons.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
<script src="adt.js"></script>
<style>body{margin:0}a{color:var(--ds-accent)}a:hover{color:var(--ds-fg)}</style>
</helmet>
<sc-if value="{{ v_erp }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" active="{{ active }}" title="{{ shellTitle }}" width="100%" height="100%" hint-size="100%,100%">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" hint-size="100%,600px">
<sc-if value="{{ isSinPermiso }}" hint-placeholder-val="{{ false }}">
<div style="min-height:480px;display:flex;flex-direction:column">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Forbidden" title="No tienes acceso a Asistencia" description="Verificar marcas dentro del ERP es para administración, RRHH y supervisores. La verificación pública sigue disponible en opai.cl/verificar. Pídele acceso a Carlos Irigoyen." action-label="Pedir acceso" hint-size="100%,320px"></x-import>
</div>
</sc-if>
<sc-if value="{{ notSinPermiso }}" hint-placeholder-val="{{ true }}">
<dc-import name="Verificador-Hash" device="{{ device }}" estado="{{ estado }}" vista="" hint-size="100%,640px"></dc-import>
</sc-if>
</x-import>
</x-import>
</sc-if>
<sc-if value="{{ isPublic }}" hint-placeholder-val="{{ true }}">
<div class="ds screen" data-device="{{ device }}" data-theme="{{ theme }}" style="width:100%;height:100%">
<sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}"><div class="safe-top"></div></sc-if>
<header style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 {{ gutter }};border-bottom:1px solid var(--ds-border);flex:none">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Wordmark" suffix="Verificar" hint-size="140px,24px"></x-import>
<span class="t-caption">opai.cl/verificar</span>
</header>
<div style="flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:24px {{ gutter }} 32px">
<dc-import name="Verificador-Hash" device="{{ device }}" estado="{{ estado }}" vista="{{ vista }}" hint-size="100%,640px"></dc-import>
</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;datos&quot;,&quot;vacio&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;datos&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vista&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;nofound&quot;,&quot;erp&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (!window.ADT) { this.t = setInterval(() => { if (window.ADT) { clearInterval(this.t); this.forceUpdate(); } }, 50); } }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const A = window.ADT;
    if (!A) return { isPublic: false, v_erp: false };
    const b = A.base(this.props, "rep", "Verificar marcación");
    return { ...b, isPublic: !b.v_erp, notSinPermiso: !b.isSinPermiso, gutter: b.isPhone ? "16px" : b.isTablet ? "24px" : "32px" };
  }
}
</script>
</body>
</html>
