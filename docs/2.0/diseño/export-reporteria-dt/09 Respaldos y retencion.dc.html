<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<script src="adt.js"></script>
<style>body{margin:0;background:#d4d4d8}a{color:var(--ds-n-900)}a:hover{color:var(--ds-n-600)}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:56px;padding:48px;width:max-content;font-family:var(--font-sans);color:var(--ds-n-900)">
<header style="display:flex;flex-direction:column;gap:6px;max-width:960px">
<a href="Indice.dc.html" style="font:400 14px/20px var(--font-sans)">← Índice · OPAI 2.0 Asistencia DT v1</a>
<h1 style="margin:0;font:600 36px/40px var(--font-sans);letter-spacing:-0.02em">{{ num }} · {{ title }}</h1>
<span style="font:400 16px/24px var(--font-sans);color:var(--ds-n-700)">Ve: {{ roles }}</span>
</header>
<sc-for list="{{ rows }}" as="row" hint-placeholder-count="2">
<section style="display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:12px;align-items:center">
<h2 style="margin:0;font:600 22px/28px var(--font-sans);letter-spacing:-0.01em">{{ row.label }}</h2>
<sc-if value="{{ row.isB }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/18px var(--font-sans);padding:2px 10px;border-radius:999px;background:var(--ds-n-900);color:var(--ds-n-0)">Variante B · Propuesta, a confirmar por Carlos</span></sc-if>
</div>
<div style="display:flex;gap:32px;align-items:flex-start">
<sc-for list="{{ row.boards }}" as="b" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font:500 13px/18px var(--font-sans);color:var(--ds-n-700)">{{ b.label }}</span>
<sc-if value="{{ b.isPhone }}" hint-placeholder-val="{{ false }}"><div style="width:375px;height:812px;border-radius:16px;overflow:hidden;outline:1px solid var(--ds-n-300)"><dc-import name="P09-Respaldos" device="{{ b.device }}" theme="{{ b.theme }}" estado="{{ b.estado }}" vista="{{ b.vista }}" variante="{{ b.variante }}" hint-size="375px,812px"></dc-import></div></sc-if>
<sc-if value="{{ b.isTablet }}" hint-placeholder-val="{{ false }}"><div style="width:1024px;height:768px;border-radius:16px;overflow:hidden;outline:1px solid var(--ds-n-300)"><dc-import name="P09-Respaldos" device="{{ b.device }}" theme="{{ b.theme }}" estado="{{ b.estado }}" vista="{{ b.vista }}" variante="{{ b.variante }}" hint-size="1024px,768px"></dc-import></div></sc-if>
<sc-if value="{{ b.isDesktop }}" hint-placeholder-val="{{ false }}"><div style="width:1280px;height:800px;border-radius:16px;overflow:hidden;outline:1px solid var(--ds-n-300)"><dc-import name="P09-Respaldos" device="{{ b.device }}" theme="{{ b.theme }}" estado="{{ b.estado }}" vista="{{ b.vista }}" variante="{{ b.variante }}" hint-size="1280px,800px"></dc-import></div></sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() { if (!window.ADT) { this.t = setInterval(() => { if (window.ADT) { clearInterval(this.t); this.forceUpdate(); } }, 50); } }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const A = window.ADT;
    if (!A) return { rows: [] };
    const s = A.screens.find((x) => x.n === "09");
    return { num: s.n, title: s.title, roles: s.roles, rows: s.rows.map((r, i) => ({ ...r, key: i, isB: r.variante === "B", boards: A.boardsFor(r) })) };
  }
}
</script>
</body>
</html>
