<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>body{margin:0;background:var(--ds-fill)}</style>
</helmet>
<dc-import name="Lamina" prefijo="7" titulo="7 · Vista por rol" nota="La portada vista por cada rol por defecto. Una tarjeta aparece solo si la persona ve al menos una de sus entradas. Supervisor y Visualizador nunca ven Agentes, Integraciones ni Consumos. El Visualizador no tiene botones de escritura." secciones="{{ secciones }}" hint-size="100%,100%"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const R = (id, titulo, nota, rol, n) => ({ id, titulo, nota, bases: [{ n, s: titulo, x3: true, o: { vista: "portada", rol } }] });
    return { secciones: [
      R("owner", "Owner y Administrador · 6 tarjetas", "Empresa, Operación, Personas y acceso, Agentes, Módulos y Uso y registros.", "admin", "Rol_Admin"),
      R("gerente", "Gerente · 5 tarjetas", "Sin Agentes. En Uso y registros ve Consumos y Auditoría, pero no Integraciones.", "gerente", "Rol_Gerente"),
      R("supervisor", "Supervisor · 3 tarjetas", "Empresa, Operación y Módulos, sin Datos personales ni Comunicaciones.", "supervisor", "Rol_Supervisor"),
      R("visualizador", "Visualizador · 4 tarjetas", "Empresa, Operación, Personas y acceso y Módulos, solo lectura.", "viewer", "Rol_Visualizador"),
    ] };
  }
}
</script>
</body>
</html>
