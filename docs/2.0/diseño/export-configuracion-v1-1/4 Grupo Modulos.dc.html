<dc-import name="Lamina" prefijo="4" titulo="4 · Grupo Módulos" nota="Rutas /configuracion/grupo/modulos y /configuracion/modulo/‹id›. Primero «Catálogo de módulos» y después cada módulo activo o en prueba. Como pasan de 7, la lista lleva su propio buscador y no se divide. Al abrir un módulo, la lista queda a la izquierda con el módulo seleccionado y a la derecha sus pestañas. A 375, primero la lista y después la entrada, que vuelve con «‹ Módulos»." secciones="{{ secciones }}" hint-size="100%,100%"></dc-import>

      { id: "rondas", titulo: "Rondas › Tipos de incidente", nota: "Migas «Configuración › Módulos» y lista de 9 entradas con buscador.", bases: [
