</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const g = { vista: "grupo", grupo: "modulos", b1: true };
    return { secciones: [
      { id: "documentos", titulo: "Módulos › Documentos", nota: "Documentos aparece en la lista de módulos, que pasa a 10 entradas.", bases: [
        { n: "B1_Modulos_Documentos", s: "Tipos de documento", o: { ...g, entrada: "documentos" } },
        { n: "B1_Modulos_Documentos", s: "Tipos de documento", o: { ...g, entrada: "documentos", device: "tablet" } },
        { n: "B1_Modulos_lista", s: "Lista de módulos", o: { ...g, device: "phone" } },
        { n: "B1_Documentos", s: "Entrada con «‹ Módulos»", o: { vista: "entrada", grupo: "modulos", entrada: "documentos", b1: true, device: "phone" } },
      ] },
      { id: "operacion", titulo: "Operación sin Documentos", nota: "El grupo queda con Patrones y funciones y Calendario.", bases: [{ n: "B1_Operacion", s: "Sin Documentos", x3: true, o: { vista: "grupo", grupo: "operacion", b1: true } }] },
    ] };
  }
}
</script>
