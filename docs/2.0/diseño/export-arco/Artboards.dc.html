<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/icons.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
<style>body{margin:0;background:var(--ds-fill)} a{color:var(--ds-accent)} a:hover{color:var(--ds-fg)}</style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:48px;font-family:var(--font-sans);color:var(--ds-fg);background:var(--ds-fill);width:max-content">
<div style="display:flex;flex-direction:column;gap:6px">
<a href="00 Indice.dc.html" class="t-body-sm" style="text-decoration:none">← Índice</a>
<h1 class="t-title" style="margin:0">{{ heading }}</h1>
<span class="t-body-sm" style="color:var(--ds-fg-muted)">{{ roles }}</span>
</div>
<sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:16px">
<span class="t-subheading" style="font-weight:600">{{ row.label }}</span>
<div style="display:flex;gap:40px;align-items:flex-start">
<sc-for list="{{ row.items }}" as="a" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:8px">
<span class="t-caption" style="color:var(--ds-fg-muted)">{{ a.label }}</span>
<dc-import name="Cumplimiento ARCO" screen="{{ a.screen }}" device="{{ a.device }}" theme="{{ a.theme }}" st="{{ a.st }}" controls="{{ false }}" style="width:{{ a.w }}px;height:{{ a.h }}px" hint-size="375px,780px"></dc-import>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;screen&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;resumen&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Pantalla&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;roles&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extras&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;[string,string][]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const screen = p.screen ?? "resumen";
    const size = { phone: [375, 780], tablet: [1024, 820], desktop: [1280, 860] };
    const lbl = { phone: "375", tablet: "1024", desktop: "1280" };
    const ab = (scr, device, theme, st, label) => ({ screen: scr, device, theme, st, w: size[device][0], h: size[device][1], label: label || lbl[device] + " · " + (theme === "dark" ? "oscuro" : "claro") });
    const devs = ["phone", "tablet", "desktop"];
    const rows = [
      { label: "Claro", items: devs.map((d) => ab(screen, d, "light", "normal")) },
      { label: "Oscuro", items: devs.map((d) => ab(screen, d, "dark", "normal")) },
      { label: "Estados · 375 claro", items: [["vacio", "Vacío"], ["cargando", "Cargando"], ["error", "Error"], ["forbidden", "Sin permiso"]].map(([s, l]) => ab(screen, "phone", "light", s, l)) },
      { label: "Estados · 1280 oscuro", items: [["vacio", "Vacío"], ["cargando", "Cargando"], ["error", "Error"], ["forbidden", "Sin permiso"]].map(([s, l]) => ab(screen, "desktop", "dark", s, l)) },
    ];
    (p.extras || []).forEach(([scr, name]) => rows.push({ label: name, items: [ab(scr, "phone", "light", "normal"), ab(scr, "desktop", "light", "normal"), ab(scr, "desktop", "dark", "normal")] }));
    return { heading: p.heading ?? "Pantalla", roles: p.roles ?? "", rows };
  }
}
</script>
</body>
</html>
