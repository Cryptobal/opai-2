<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
</helmet>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" active="per" title="Personas" tenant="Atlas Seguridad SpA" tenant-initials="AS" width="100%" height="100%" hint-size="100%,100%">
<div style="flex:1;min-width:0;overflow:auto">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" hint-size="100%,600px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PageHeader" size="heading" eyebrow="{{ s.eyebrow }}" title="{{ s.title }}" subtitle="{{ s.sub }}" badge="{{ s.badge }}" hint-size="100%,80px"></x-import>
<div style="display:flex;flex-direction:column;gap:16px">
<sc-if value="{{ s.alert }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Alerta" tono="info" titulo="{{ s.alert }}" hint-size="100%,56px">{{ s.alertBody }}</x-import>
</sc-if>
<div style="display:grid;grid-template-columns:repeat({{ cols }},minmax(0,1fr));gap:16px">
<sc-for list="{{ s.cards }}" as="c" hint-placeholder-count="3">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Card" title="{{ c.title }}" actions="{{ c.badge }}" hint-size="100%,200px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.DetailSection" rows="{{ c.rows }}" hint-size="100%,160px"></x-import>
<sc-if value="{{ c.actions }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:8px;margin-top:8px">{{ c.actions }}</div>
</sc-if>
</x-import>
</sc-for>
</div>
</div>
</x-import>
</div>
</x-import>
</x-dc>

      indice: { eyebrow: "Ficha persona v1", title: "Índice", sub: "Cada pantalla con el rol que la ve", cards: [

        { title: "2 · Previsión", rows: [{ label: "Archivo", value: "Previsión" }, { label: "Roles", value: "Owner, Admin, RRHH; Gerente en lectura" }] },
        { title: "3 · Pago", rows: [{ label: "Archivo", value: "Pago" }, { label: "Roles", value: "Owner, Admin, RRHH" }] },
        { title: "4 a 7 · Uniforme, Jornada DT, OS-10, Contacto", rows: [{ label: "Archivo", value: "Secciones (prop seccion)" }, { label: "Roles", value: "Supervisor ve 4, 5, 6 y teléfono" }] },

      device: this.props.device ?? "desktop",
      theme: this.props.theme ?? "light",
      s: S[lamina], cols: (this.props.device ?? "desktop") === "phone" ? 1 : 2,
      tabs: [{ id: "ini", label: "Inicio", icon: "home" }, { id: "ins", label: "Instalaciones", icon: "building" }, { id: "pau", label: "Pauta", icon: "calendar" }, { id: "per", label: "Personas", icon: "users" }, { id: "mas", label: "Más", icon: "more" }],

    };
  }
}
</script>
</body>
