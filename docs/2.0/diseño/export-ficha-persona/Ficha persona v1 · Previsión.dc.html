<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;masked&quot;,&quot;forbidden&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const device = this.props.device ?? "desktop";
    const estado = this.props.estado ?? "normal";
    const masked = estado === "masked";
    const m = (v) => (masked ? "••••" : v);
    const o = (a) => a.map(([value, label]) => ({ value, label }));
    return {
      device, masked,
      theme: this.props.theme ?? "light",
      isForbidden: estado === "forbidden",
      notForbidden: estado !== "forbidden",
      verifBadge: NS.Badge ? h(NS.Badge, { tone: "neutral" }, "Campo por verificar contra LRE / Previred") : null,
      afp: "habitat",
      afps: o([["habitat", "Habitat"], ["capital", "Capital"], ["cuprum", "Cuprum"], ["modelo", "Modelo"], ["planvital", "PlanVital"], ["provida", "ProVida"], ["uno", "Uno"]]),
      regimenes: o([["afp", "AFP"], ["ips", "IPS (ex INP)"]]),
      pensiones: o([["no", "Sin pensión"], ["vejez", "Vejez"], ["invalidez", "Invalidez"]]),
      saludes: o([["fonasa", "Fonasa"], ["isapre", "Isapre"]]),
      isapre: m("Colmena · Plan Esencial"),
      adicional: m("2,1 %"),
      apv: m("Sin APV"),
      cargas: [{ label: "Camila Fuentes · hija", value: m("Tramo B") }, { label: "Tomás Fuentes · hijo", value: m("Tramo B") }],
      usado: [{ label: "Contrato vigente", value: "Indefinido · 01-03-2025", numeric: true }, { label: "Última liquidación", value: "Octubre 2026" }],
      tabs: [{ id: "ini", label: "Inicio", icon: "home" }, { id: "ins", label: "Instalaciones", icon: "building" }, { id: "pau", label: "Pauta", icon: "calendar" }, { id: "per", label: "Personas", icon: "users" }, { id: "mas", label: "Más", icon: "more" }],
      groups: [
        { items: [{ id: "ini", label: "Inicio", icon: "home" }] },
        { title: "Operaciones", items: [{ id: "ins", label: "Instalaciones", icon: "building" }, { id: "pau", label: "Pauta mensual", icon: "calendar" }] },
        { title: "Personas", items: [{ id: "per", label: "Personas", icon: "users" }] },
      ],
    };
  }
}
</script>
