<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/icons.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
</helmet>
<section aria-label="Diferencias entre versiones" style="display:flex;flex-direction:column;gap:12px;min-width:0">
<div style="display:flex;flex-wrap:wrap;gap:8px 20px">
<sc-for list="{{ d.deltas }}" as="x" hint-placeholder-count="2">
<span style="display:flex;flex-direction:column"><span class="t-caption">{{ x.k }}</span><span class="t-mono" style="font-weight:600;color:{{ x.color }}">{{ x.v }}</span></span>
</sc-for>
</div>
<sc-if value="{{ lado }}" hint-placeholder-val="{{ false }}">
<div role="table" aria-label="Cambios" style="display:flex;flex-direction:column">
<div role="row" class="t-caption" style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 0 10px;font-weight:500">
<span>Línea</span><span>{{ d.a }}</span><span>{{ d.b }}</span>
</div>
<sc-for list="{{ d.rows }}" as="r" hint-placeholder-count="4">
<div role="row" style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid var(--ds-border);align-items:start">
<span style="display:flex;flex-direction:column;gap:4px;min-width:0">
<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Badge" tone="{{ r.tone }}" hint-size="80px,22px">{{ r.tipo }}</x-import><span class="t-body-sm" style="font-weight:500">{{ r.linea }}</span></span>
<span class="t-caption">{{ r.sec }}</span>
</span>
<span class="t-mono" style="color:var(--ds-fg-muted);text-decoration:{{ r.strike }};text-wrap:pretty">{{ r.antes }}</span>
<span class="t-mono" style="text-wrap:pretty">{{ r.despues }}</span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ compacto }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column">
<sc-for list="{{ d.rows }}" as="r" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--ds-border)">
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Badge" tone="{{ r.tone }}" hint-size="80px,22px">{{ r.tipo }}</x-import>
<span class="t-body-sm" style="font-weight:500">{{ r.linea }}</span>
</div>
<span class="t-mono" style="font-size:12px;line-height:16px;color:var(--ds-fg-muted);text-wrap:pretty">{{ r.cambio }}</span>
</div>
</sc-for>
</div>
</sc-if>
<span class="t-caption">{{ d.caption }}</span>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:320},&quot;diff&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{deltas:{k:string,v:string}[],rows:{tipo:string,tone:string,linea:string,cambio:string}[],caption:string}&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = this.props.diff ?? {
      deltas: [{ k: "Venta mensual", v: "+ $ 412.300" }, { k: "Margen", v: "+ 0,6 pts" }],
      rows: [{ tipo: "Cambiado", tone: "info", linea: "Kit Starlink", cambio: "Rateo 12 meses → 6 meses" }],
      caption: "v2 enviada el 22-10-2026 → v3 borrador",
    };
    const col = (v) => (/^\+/.test(v) ? "var(--ds-fg)" : /^−|^-/.test(v) ? "var(--ds-fg)" : "var(--ds-fg)");
    const lado = this.props.layout === "lado";
    return { lado, compacto: !lado, d: { ...d, deltas: (d.deltas || []).map((x) => ({ ...x, color: col(x.v) })), rows: d.rows.map((r) => ({ ...r, strike: r.tipo === "Quitado" || r.tipo === "Cambiado" ? "line-through" : "none" })) } };
  }
}
</script>
</body>
</html>
