<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/icons.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
</helmet>
<section aria-label="Resumen por categoría" style="display:flex;flex-direction:column;gap:8px;min-width:0">
<sc-if value="{{ showTitle }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
<span class="t-label-sm">Resumen por categoría</span>
<span class="t-caption">costo mensual</span>
</div>
</sc-if>
<sc-for list="{{ gs }}" as="g" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0 2px">
<span class="t-overline">{{ g.label }}</span>
<span class="t-mono subtle" style="font-size:12px;line-height:16px;white-space:nowrap">{{ g.totalTxt }}</span>
</div>
<sc-for list="{{ g.rows }}" as="row" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;opacity:{{ row.op }}">
<button type="button" onClick="{{ row.toggle }}" disabled="{{ row.empty }}" aria-expanded="{{ row.open }}" style="all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;min-height:{{ rowH }};padding:4px 6px;margin:0 -6px;border-radius:var(--radius-sm);cursor:{{ row.cursor }}" style-hover="background:var(--ds-fill)">
<span class="ic sm {{ row.chev }} subtle" aria-hidden="true" style="width:14px;height:14px;flex:none;visibility:{{ row.chevVis }}"></span>
<span class="t-body-sm" style="flex:1;min-width:0">{{ row.label }}</span>
<span style="display:flex;flex-direction:column;align-items:flex-end">
<span class="t-mono" style="white-space:nowrap">{{ row.totalTxt }}</span>
<sc-if value="{{ row.hasSub }}" hint-placeholder-val="{{ false }}"><span class="t-caption t-numeric">{{ row.sub }}</span></sc-if>
</span>
</button>
<sc-if value="{{ row.open }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;margin:0 0 6px 14px;padding-left:10px;border-left:1px solid var(--ds-border-strong)">
<sc-for list="{{ row.items }}" as="it" hint-placeholder-count="2">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:4px 0">
<span style="display:flex;flex-direction:column;min-width:0"><span class="t-body-sm">{{ it.name }}</span><span class="t-caption">{{ it.sec }}</span></span>
<span class="t-mono" style="font-size:12px;line-height:16px;white-space:nowrap">{{ it.montoTxt }}</span>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
<sc-if value="{{ hasMO }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:8px;border-top:1px solid var(--ds-border)">
<span class="t-body-sm muted">Mano de obra · sueldos y leyes sociales</span>
<span class="t-mono" style="white-space:nowrap">{{ manoObraTxt }}</span>
</div>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,totalTxt:string,rows:{id:string,label:string,totalTxt:string,sub?:string,items:{name:string,sec:string,montoTxt:string}[]}[]}[]&quot;},&quot;manoObraTxt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;defaultOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,boolean&gt;&quot;}}">
class Component extends DCLogic {
  state = { open: {} };
  renderVals() {
    const groups = this.props.groups ?? [
      { label: "Directos", totalTxt: "$ 473.198", rows: [{ id: "uniformes", label: "Uniformes", totalTxt: "$ 190.000", items: [{ name: "Uniforme y EPP", sec: "Planta Norte", montoTxt: "$ 152.000" }] }, { id: "alimentacion", label: "Alimentación", totalTxt: "$ 0", items: [] }] },
    ];
    const open = { ...(this.props.defaultOpen || {}), ...this.state.open };
    const gs = groups.map((g) => ({
      ...g,
      rows: g.rows.map((r) => {
        const empty = !r.items || r.items.length === 0;
        const o = !empty && !!open[r.id];
        return {
          ...r, empty, open: o, op: empty ? 0.45 : 1, cursor: empty ? "default" : "pointer",
          chev: o ? "i-chevron-down" : "i-chevron-right", chevVis: empty ? "hidden" : "visible", hasSub: !!r.sub,
          toggle: () => !empty && this.setState({ open: { ...open, [r.id]: !o } }),
        };
      }),
    }));
    return { gs, manoObraTxt: this.props.manoObraTxt, hasMO: !!this.props.manoObraTxt, showTitle: !this.props.hideTitle, rowH: this.props.touch ? "44px" : "32px" };
  }
}
</script>
</body>
</html>
