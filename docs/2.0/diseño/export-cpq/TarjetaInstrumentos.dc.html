<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/styles.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/fonts.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/colors.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/typography.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/spacing.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/base.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/tokens/icons.css">
<link rel="stylesheet" href="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/components/components.css">
<script src="_ds/opai-2-0-design-system-v2-44e4d7b9-7464-4771-bff8-07fcff4d573d/_ds_bundle.js"></script>
</helmet>
<section class="card" aria-label="Instrumentos financieros" style="padding:4px 16px 8px">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 0 8px">
<span class="t-label">Instrumentos financieros</span>
<span class="t-mono subtle" style="font-size:12px;line-height:16px;white-space:nowrap">{{ totalTxt }}</span>
</div>
<sc-for list="{{ rows }}" as="f" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--ds-border);min-height:64px">
<button type="button" onClick="{{ f.edit }}" disabled="{{ f.noEdit }}" aria-haspopup="dialog" aria-label="{{ f.editLabel }}" style="all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 8px;margin:0 -8px;border-radius:var(--radius-md);cursor:{{ f.cursor }};opacity:{{ f.op }}" style-hover="background:{{ f.hoverBg }}">
<span class="t-body-sm" style="font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ f.name }}</span>
<span class="t-caption t-numeric" style="text-wrap:pretty">{{ f.summary }}</span>
<span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px">
<span class="t-mono" style="white-space:nowrap">{{ f.montoTxt }}</span>
<sc-if value="{{ f.overridden }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Badge" tone="neutral" dot="{{ false }}" hint-size="90px,22px">Sobrescrito</x-import>
</sc-if>
</span>
</button>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Switch" checked="{{ f.on }}" on-change="{{ f.toggle }}" disabled="{{ readOnly }}" hint-size="48px,44px"></x-import>
</div>
</sc-for>
<sc-if value="{{ editable }}" hint-placeholder-val="{{ true }}">
<span class="t-caption" style="display:block;padding:4px 0 6px">Toca un instrumento para editar sus valores.</span>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:300},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,name:string,on:boolean,summary:string,montoTxt:string,overridden:boolean}[]&quot;},&quot;editable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;totalTxt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,on:boolean)=&gt;void&quot;},&quot;onEdit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string,e:Event)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items ?? [{ id: "cf", name: "Costo financiero", on: true, summary: "45 días · 1,0 % mensual", montoTxt: "$ 248.412 al mes", overridden: false }];
    const editable = this.props.editable ?? true;
    const tg = this.props.onToggle, ed = this.props.onEdit;
    return {
      editable, readOnly: !editable, totalTxt: this.props.totalTxt ?? "",
      rows: items.map((f) => ({
        ...f, op: f.on ? 1 : 0.45, noEdit: !editable, cursor: editable ? "pointer" : "default", hoverBg: editable ? "var(--ds-fill)" : "transparent",
        editLabel: "Editar " + f.name.toLowerCase(),
        edit: (e) => editable && ed && ed(f.id, e), toggle: (v) => tg && tg(f.id, v),
      })),
    };
  }
}
</script>
</body>
</html>
