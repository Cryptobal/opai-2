<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./nomina-data.js"></script><style>body{margin:0}a{color:var(--ds-accent)}a:hover{color:var(--ds-fg)}</style></helmet>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" active="{{ active }}" title="{{ shellTitle }}" user="{{ user }}" tenant="Atlas Seguridad SpA" tenant-initials="AS" width="100%" height="100%" hint-size="100%,100%">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" hint-size="100%,600px">
<sc-if value="{{ showHeader }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.PageHeader" eyebrow="Nómina" title="Calendario de obligaciones" subtitle="Lo que hay que generar, presentar y respaldar en cada período" badge="{{ roleBadge }}" hint-size="100%,80px">
<sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Button" icon="refresh" hint-size="190px,40px">Generar pendientes</x-import>
</sc-if>
</x-import>
</sc-if>

<sc-if value="{{ isOk }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:16px">
<div style="max-width:320px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Segmentado" options="{{ segOpts }}" value="{{ seg }}" on-change="{{ setSeg }}" label="Tipo de obligación" hint-size="100%,40px"></x-import>
</div>
<sc-if value="{{ isMensual }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ meses }}" as="mes" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;gap:8px;align-items:center"><span class="t-label">{{ mes.t }}</span><x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Badge" tone="{{ mes.tone }}" dot="{{ true }}" hint-size="80px,22px">{{ mes.estado }}</x-import></div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ mes.rows }}" cards="{{ isPhone }}" to-card="{{ toCard }}" hint-size="100%,200px"></x-import>
</div>
</sc-for>
</sc-if>
<sc-if value="{{ isAnual }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:8px">
<span class="t-label">Año tributario 2027 · remuneraciones 2026</span>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ anuales }}" cards="{{ isPhone }}" to-card="{{ toCard }}" hint-size="100%,160px"></x-import>
<span class="t-caption" style="color:var(--ds-fg-muted)">Número de formulario, plazo y formato de cada declaración al SII por verificar con el SII y el contador.</span>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isCargando }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:16px" aria-busy="true">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="320px" height="{{ 40 }}" radius="{{ 10 }}" hint-size="320px,40px"></x-import>
<div style="border:1px solid var(--ds-border);border-radius:var(--radius-lg);background:var(--ds-surface)">
<sc-for list="{{ skel }}" as="s" hint-placeholder-count="5">
<div style="display:flex;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ds-border)">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="200px" height="{{ 14 }}" hint-size="200px,14px"></x-import>
<div style="flex:1"></div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="120px" height="{{ 20 }}" radius="{{ 999 }}" hint-size="120px,20px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="100px" height="{{ 32 }}" radius="{{ 10 }}" hint-size="100px,32px"></x-import>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isVacio }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Empty" icon="calendar" title="Aún no hay obligaciones" description="Aparecen cuando abres el primer período de remuneraciones." action="{{ emptyAction }}" hint-size="100%,320px"></x-import>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.ErrorState" title="No pudimos cargar el calendario" description="Revisa tu conexión. Si el problema sigue, avísale a soporte con el código." code="NOM-CAL-503" on-retry="{{ noop }}" hint-size="100%,320px"></x-import>
</sc-if>
<sc-if value="{{ isSinPermiso }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Forbidden" title="No tienes acceso a Nómina" description="Las remuneraciones solo las ven RRHH, gerencia y administración. Pídele acceso a Marcela Rojas, administrador de Atlas Seguridad SpA." action-label="Pedir acceso" on-action="{{ noop }}" hint-size="100%,320px"></x-import>
</sc-if>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;vacio&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;rrhh&quot;,&quot;gerente&quot;,&quot;inspector&quot;,&quot;supervisor&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { seg: "mes" };
  renderVals() {
    const h = React.createElement;
    const NS = window.OPAI20DesignSystem_44e4d7 || {};
    const ND = window.ND;
    if (!ND) return {};
    const b = ND.base(this.props, "cal", "Calendario de obligaciones");
    const ro = b.readOnly;
    const O = (id, o, quien, est, tone, acc) => ({ id, o, quien, plazo: "Plazo por verificar", est, tone, acc });
    const meses = [
      { t: "Octubre 2026", estado: "En revisión", tone: "warning", rows: [
        O(1, "LRE en Mi DT", "Representante laboral electrónico", "Con errores", "danger", "Generar"),
        O(2, "Previred · cotizaciones", "Responsable de pagos", "Generado", "info", "Subir comprobante"),
        O(3, "Retención de impuesto único para el F29", "Contador", "Generado", "info", "Subir comprobante"),
      ] },
      { t: "Septiembre 2026", estado: "Pagado", tone: "success", rows: [
        O(4, "LRE en Mi DT", "Representante laboral electrónico", "Cargado con comprobante", "success", null),
        O(5, "Previred · cotizaciones", "Responsable de pagos", "Pagado con comprobante", "success", null),
        O(6, "Retención de impuesto único para el F29", "Contador", "Por subir comprobante", "warning", "Subir comprobante"),
      ] },
    ];
    const anuales = [
      O(7, "Declaración Jurada de sueldos", "Contador", "Por generar", "neutral", "Generar"),
      O(8, "Certificados de sueldos · 152 trabajadores", "RRHH", "Por generar", "neutral", "Generar"),
    ];
    const plazoEl = () => h("span", { style: { display: "inline-flex", gap: 6, alignItems: "center", color: "var(--ds-fg-muted)" } }, NS.Badge ? h(NS.Badge, { tone: "neutral" }, "Plazo por verificar") : "Plazo por verificar");
    return {
      ...b,
      roleBadge: b.isInspector && NS.Badge ? h(NS.Badge, { tone: "info" }, "Solo lectura") : null,
      seg: this.state.seg, setSeg: (v) => this.setState({ seg: v }),
      isMensual: this.state.seg === "mes", isAnual: this.state.seg === "anu",
      segOpts: [{ value: "mes", label: "Mensuales" }, { value: "anu", label: "Anuales" }],
      meses, anuales,
      cols: [
        { key: "o", label: "Obligación", strong: true },
        { key: "quien", label: "La presenta", muted: true },
        { key: "plazo", label: "Fecha límite", render: plazoEl },
        { key: "est", label: "Estado", render: (r) => (NS.Badge ? h(NS.Badge, { tone: r.tone, dot: true }, r.est) : r.est) },
        { key: "acc", label: "", align: "right", render: (r) => (r.acc && !ro && NS.Button ? h(NS.Button, { variant: "secondary", icon: r.acc === "Generar" ? "refresh" : "paperclip" }, r.acc) : null) },
      ],
      toCard: (r) => ({ icon: "calendar", title: r.o, subtitle: r.quien + " · Plazo por verificar", badge: { tone: r.tone, label: r.est }, chevron: true }),
      emptyAction: NS.Button && b.canEdit ? h(NS.Button, { icon: "plus" }, "Abrir período") : null,
    };
  }
}
</script>
</body>
</html>
