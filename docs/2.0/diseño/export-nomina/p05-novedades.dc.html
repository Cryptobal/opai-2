<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><script src="./nomina-data.js"></script><style>body{margin:0}a{color:var(--ds-accent)}a:hover{color:var(--ds-fg)}</style></helmet>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.AppShell" device="{{ device }}" theme="{{ theme }}" tabs="{{ tabs }}" groups="{{ groups }}" active="{{ active }}" title="{{ shellTitle }}" user="{{ user }}" overlay="{{ overlay }}" tenant="Atlas Seguridad SpA" tenant-initials="AS" width="100%" height="100%" hint-size="100%,100%">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Page" hint-size="100%,600px">
<sc-if value="{{ showHeader }}" hint-placeholder-val="{{ true }}">

<sc-if value="{{ canEdit }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Button" icon="download" on-click="{{ openSheet }}" hint-size="150px,40px">Carga masiva</x-import>
</sc-if>
</x-import>
</sc-if>

<sc-if value="{{ isOk }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:16px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Alerta" tono="warning" titulo="3 licencias sin documento" hint-size="100%,72px">Adjunta la licencia médica para que quede respaldada en el libro de remuneraciones.</x-import>

<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Tabs" items="{{ tabItems }}" value="{{ tab }}" on-change="{{ setTab }}" hint-size="100%,44px"></x-import>
<sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
<div style="margin:0 -16px">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ rows }}" cards="{{ true }}" to-card="{{ toCard }}" on-row-click="{{ noop }}" hint-size="100%,300px"></x-import>
</div>
</sc-if>
<sc-if value="{{ notPhone }}" hint-placeholder-val="{{ true }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Table" columns="{{ cols }}" rows="{{ rows }}" on-row-click="{{ noop }}" hint-size="100%,300px"></x-import>
</sc-if>
</div>
</sc-if>

<sc-if value="{{ isCargando }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:16px" aria-busy="true">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" height="{{ 64 }}" radius="{{ 10 }}" hint-size="100%,64px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="60%" height="{{ 32 }}" hint-size="60%,32px"></x-import>
<div style="border:1px solid var(--ds-border);border-radius:var(--radius-lg);background:var(--ds-surface)">
<sc-for list="{{ skel }}" as="s" hint-placeholder-count="5">
<div style="display:flex;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ds-border)">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="90px" height="{{ 14 }}" hint-size="90px,14px"></x-import>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="140px" height="{{ 14 }}" hint-size="140px,14px"></x-import>
<div style="flex:1"></div>
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Skeleton" width="80px" height="{{ 14 }}" hint-size="80px,14px"></x-import>
</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isVacio }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Empty" icon="clipboard" title="Aún no hay novedades en octubre" description="Carga anticipos, préstamos o descuentos con una planilla, o espera el resumen de Asistencia." action="{{ emptyAction }}" hint-size="100%,320px"></x-import>
</sc-if>
<sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.ErrorState" title="No pudimos cargar las novedades" description="Revisa tu conexión. Si el problema sigue, avísale a soporte con el código." code="NOM-NOV-503" on-retry="{{ noop }}" hint-size="100%,320px"></x-import>
</sc-if>
<sc-if value="{{ isSinPermiso }}" hint-placeholder-val="{{ false }}">
<x-import component-from-global-scope="OPAI20DesignSystem_44e4d7.Forbidden" title="No tienes acceso a Nómina" description="Las remuneraciones solo las ven RRHH, gerencia y administración. Pídele acceso a Marcela Rojas, administrador de Atlas Seguridad SpA." action-label="Pedir acceso" on-action="{{ noop }}" hint-size="100%,320px"></x-import>
</sc-if>
</x-import>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;phone&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;vacio&quot;,&quot;cargando&quot;,&quot;error&quot;,&quot;sinpermiso&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;rrhh&quot;,&quot;gerente&quot;,&quot;inspector&quot;,&quot;supervisor&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

</body>
</html>
