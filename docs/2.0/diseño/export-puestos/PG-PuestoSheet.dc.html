<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-design-system-00ba34e0-dc81-4559-9ac3-3ae7b680284c/colors_and_type.css">
<script src="_ds/opai-design-system-00ba34e0-dc81-4559-9ac3-3ae7b680284c/_ds_bundle.js"></script>
<script src="pg-data.js"></script>
<script src="pg-icons.js"></script>
</helmet>
<div>
  <div onClick="{{ close }}" style="position:fixed;inset:0;background:rgba(11,11,12,.32);z-index:50;"></div>
  <aside style="position:fixed;z-index:51;top:0;right:0;bottom:0;width:{{ w }};max-width:100%;background:hsl(var(--app-card));border-left:1px solid hsl(var(--ds-border-default));box-shadow:0 12px 32px -8px rgba(17,17,19,.18),0 2px 6px rgba(17,17,19,.06);display:flex;flex-direction:column;animation:pgSheet .2s cubic-bezier(0.2,0,0,1);">
    <div style="flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid hsl(var(--ds-border-subtle));">
      <sc-if value="{{ m }}"><button onClick="{{ close }}" style="height:44px;margin-left:-8px;padding:0 8px;border:0;background:transparent;color:hsl(var(--ds-text-2));display:flex;align-items:center;gap:4px;font-size:14px;cursor:pointer;"><pg-i name="chevron-left" size="18"></pg-i>Atrás</button></sc-if>
      <span style="flex:1;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--ds-text-3));">Puesto</span>
      <sc-if value="{{ canEdit }}"><button onClick="{{ toggleMenu }}" aria-label="Más acciones" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:hsl(var(--ds-text-2));display:grid;place-items:center;cursor:pointer;"><pg-i name="more" size="18"></pg-i></button></sc-if>
      <sc-if value="{{ md }}"><button onClick="{{ close }}" aria-label="Cerrar" style="width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:hsl(var(--ds-text-2));display:grid;place-items:center;cursor:pointer;"><pg-i name="x" size="18"></pg-i></button></sc-if>
      <sc-if value="{{ menuOpen }}">
        <div style="position:absolute;right:52px;top:52px;z-index:5;min-width:160px;padding:4px;border:1px solid hsl(var(--ds-border-default));border-radius:10px;background:hsl(var(--app-popover));box-shadow:0 12px 32px -8px rgba(17,17,19,.18),0 2px 6px rgba(17,17,19,.06);">
          <button onClick="{{ edit }}" style="width:100%;height:40px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:hsl(var(--ds-text-1));font-size:13px;text-align:left;cursor:pointer;" style-hover="background:hsl(var(--app-muted));">Editar</button>
          <button onClick="{{ deact }}" style="width:100%;height:40px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:hsl(var(--ds-danger-fg));font-size:13px;text-align:left;cursor:pointer;" style-hover="background:hsl(var(--app-muted));">Desactivar</button>
        </div>
      </sc-if>
    </div>
    <div style="flex:1;overflow:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <h2 style="margin:0;font-size:21px;line-height:28px;font-weight:600;letter-spacing:-.01em;">{{ p.nombre }}</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
          <span style="display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;background:{{ badge.bg }};color:{{ badge.fg }};"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>{{ badge.t }}</span>
          <span style="font-size:13px;color:hsl(var(--ds-text-3));">{{ instName }}</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">
          <sc-if value="{{ canAssign }}">
            <button onClick="{{ primary }}" style="flex:1;height:{{ btnH }};padding:0 16px;border:0;border-radius:10px;background:hsl(var(--app-primary));color:hsl(var(--app-primary-fg));font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;">{{ primaryLabel }}</button>
          </sc-if>
          <button onClick="{{ verPauta }}" style="flex:1;height:{{ btnH }};padding:0 16px;border:1px solid hsl(var(--ds-border-strong));border-radius:10px;background:transparent;color:hsl(var(--ds-text-1));font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;"><pg-i name="calendar" size="16"></pg-i>Ver pauta</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:{{ pairCols }};gap:12px 20px;">
        <sc-for list="{{ pairs }}" as="r" hint-placeholder-count="8">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;grid-column:{{ r.span }};"><span style="font-size:12px;color:hsl(var(--ds-text-3));">{{ r.k }}</span><span style="text-wrap:pretty;">{{ r.v }}</span></div>
        </sc-for>
      </div>
      <sc-if value="{{ origen }}">
        <button onClick="{{ onOrigen }}" style="align-self:flex-start;height:32px;padding:0 12px;border-radius:999px;border:1px solid hsl(var(--ds-border-default));background:transparent;color:hsl(var(--ds-text-2));font-size:12px;cursor:pointer;font-family:var(--app-font-mono);">Origen: CPQ-2026-0118 · línea 2</button>
      </sc-if>
      <section style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--ds-text-3));">Asignaciones vigentes</span>
        <div style="border:1px solid hsl(var(--ds-border-default));border-radius:10px;">
          <sc-for list="{{ asig }}" as="a" hint-placeholder-count="2">
            <div style="min-height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid hsl(var(--ds-border-subtle));">
              <span style="width:32px;height:32px;border-radius:50%;flex:none;background:{{ a.av }};color:{{ a.avFg }};display:grid;place-items:center;font-size:11px;font-weight:600;">{{ a.ini }}</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                <span style="font-weight:500;color:{{ a.fg }};">{{ a.nombre }}</span>
                <span style="font-size:12px;color:hsl(var(--ds-text-3));">{{ a.rol }}{{ a.desde }}</span>
                <sc-if value="{{ a.sale }}"><span style="align-self:flex-start;margin-top:2px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid hsl(var(--ds-warn-border));color:hsl(var(--ds-warn-fg));background:hsl(var(--ds-warn-soft));">{{ a.sale }}</span></sc-if>
              </span>
              <sc-if value="{{ a.canAdd }}"><button onClick="{{ a.onAdd }}" style="height:40px;padding:0 12px;border:1px solid hsl(var(--ds-border-strong));border-radius:10px;background:transparent;color:hsl(var(--ds-text-1));font-size:13px;font-weight:500;cursor:pointer;">+ Asignar</button></sc-if>
            </div>
          </sc-for>
        </div>
      </section>
      <section style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--ds-text-3));">Serie de los próximos 28 días</span>
        <sc-for list="{{ tiras }}" as="tr" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <span style="font-size:12px;color:hsl(var(--ds-text-2));">{{ tr.label }}</span>
            <div style="display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;">
              <sc-for list="{{ tr.cells }}" as="x" hint-placeholder-count="28">
                <span title="{{ x.title }}" style="height:28px;border-radius:4px;background:{{ x.bg }};color:{{ x.fg }};border:1px solid {{ x.bd }};display:grid;place-items:center;font-size:{{ x.fs }};font-weight:600;font-family:var(--app-font-mono);">{{ x.t }}</span>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <span style="font-size:12px;color:hsl(var(--ds-text-3));">{{ tiraFoot }}</span>
      </section>
      <section style="display:flex;flex-direction:column;gap:10px;">
        <span style="font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--ds-text-3));">Historial de asignaciones</span>
        <sc-for list="{{ hist }}" as="h" hint-placeholder-count="2">
          <div style="display:flex;gap:10px;font-size:13px;"><span style="width:6px;height:6px;margin-top:7px;border-radius:50%;background:hsl(var(--ds-border-strong));flex:none;"></span><span style="flex:1;"><span style="font-weight:500;">{{ h.n }}</span> · {{ h.r }}<br><span style="font-size:12px;color:hsl(var(--ds-text-3));font-family:var(--app-font-mono);">{{ h.d }}</span></span></div>
        </sc-for>
      </section>
      <button onClick="{{ verPauta }}" style="align-self:flex-start;height:44px;padding:0;border:0;background:transparent;color:hsl(var(--app-primary));font-weight:500;cursor:pointer;">Ver en la pauta ›</button>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menu: false };
  componentDidMount() { if (!window.PG) this.iv = setInterval(() => { if (window.PG) { clearInterval(this.iv); this.forceUpdate(); } }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const D = window.PG, c = this.props.ctx || {};
    if (!D) return { p: {}, badge: {} };
    const inst = D.instalaciones.find(i => i.id === c.inst) || D.instalaciones[0];
    const list = D.puestos[inst.id] || D.puestos.quilicura;
    const p = list.find(x => x.id === c.puesto) || list[1] || list[0];
    const tones = { ok: ['ok', 'Cubierto'], ppc: ['danger', 'PPC · ' + p.motivo], prog: ['none', 'Programado'], none: ['none', 'Sin turno hoy'] };
    const [tk, tt] = tones[p.hoy];
    const badge = { t: tt, bg: tk === 'none' ? 'hsl(var(--app-muted))' : 'hsl(var(--ds-' + tk + '-soft))', fg: tk === 'none' ? 'hsl(var(--ds-text-2))' : 'hsl(var(--ds-' + tk + '-fg))' };
    const capaTxt = p.capa === 'Grupo' ? 'Grupo «Control de acceso 4x4 · Logística Andina»' : p.capa === 'Puesto' ? 'Sueldo propio del puesto' : 'Sueldo de la instalación';
    const monto = !c.money ? '••••' : p.capa === 'Grupo' ? '$ 700.000/mes' : p.capa === 'Puesto' ? '$ 930.000/mes' : inst.total + '/mes';
    const corr = !p.semanal;
    const pairs = [
      ['Función', p.funcion], ['Rol', corr ? p.rol + ' (corrido)' : p.rol + ' (semanal)'], ['Horario', p.horario + (p.mid ? ' +1' : '')], ['Horas semanales', p.horas + (corr ? ' promedio' : '')],
      ['Colación', p.id === 'rec' ? '30 min, fuera de la jornada' : '60 min, fuera de la jornada'], ['Inicio del ciclo', p.temporal ? '15-12-2026' : '01-11-2026'],
      ['Vigencia', p.temporal ? 'Temporal · 15-12-2026 → 05-01-2027' : 'Desde 01-03-2025, indefinida'], ['Capa de sueldo', capaTxt + ' · ' + monto, '1 / -1']
    ].map(([k, v, span]) => ({ k, v, span: span || 'auto' }));
    const ini = n => n.split(' ').map(x => x[0]).slice(0, 2).join('');
    const assign = (rol) => c.open('P03', { puesto: p.id, rolAsig: rol });
    const mkA = (n, rol, desde, sale) => n ? { nombre: n, ini: ini(n), rol, desde: ' · desde ' + desde, av: 'hsl(var(--app-muted))', avFg: 'hsl(var(--ds-text-2))', fg: 'hsl(var(--ds-text-1))', sale, canAdd: false }
      : { nombre: 'Sin asignar', ini: '+', rol, desde: '', av: 'hsl(var(--ds-danger-soft))', avFg: 'hsl(var(--ds-danger-fg))', fg: 'hsl(var(--ds-danger-fg))', canAdd: c.assign, onAdd: () => assign(rol) };
    const asig = [mkA(p.titular, 'Titular', '01-03-2025', p.id === 'ca-d2' ? 'Sale el 16-11-2026 · anexo pendiente' : '')];
    if (corr) asig.push(mkA(p.relevo, 'Relevo', '01-03-2025'));
    const from = p.temporal ? 44 : -6;
    const mkCells = key => D.strip(key, from, 28).map((v, i) => { const u = D.cellUI(v); const d = D.dateOf(from + i); return { t: u.t, bg: u.bg, fg: u.fg, bd: u.bd, fs: u.ppc ? '8px' : '12px', title: d.wd + ' ' + d.dd + '-' + d.mm + ' · ' + u.tip }; });
    const tiras = [{ label: 'Titular · ' + (p.titular || 'Sin asignar'), cells: mkCells(p.sT) }];
    if (corr) tiras.push({ label: 'Relevo · ' + (p.relevo || 'Sin asignar'), cells: mkCells(p.sR) });
    const d0 = D.dateOf(from), d1 = D.dateOf(from + 27);
    const missing = !p.titular || (corr && !p.relevo);
    const primaryLabel = !p.titular ? 'Asignar titular' : (corr && !p.relevo) ? 'Asignar relevo' : 'Editar';
    const hist = p.id === 'ca-d2' ? [{ n: 'Pablo Gutiérrez', r: 'Titular', d: '01-03-2025 → hoy' }, { n: 'Hernán Saavedra', r: 'Relevo', d: '01-03-2025 → 30-09-2026' }]
      : p.titular ? [{ n: p.titular, r: 'Titular', d: '01-03-2025 → hoy' }].concat(corr && p.relevo ? [{ n: p.relevo, r: 'Relevo', d: '01-03-2025 → hoy' }] : []) : [{ n: 'Aún no tiene asignaciones', r: 'nace en PPC', d: 'Creado 25-10-2026' }];
    const close = () => c.close();
    return {
      p, badge, instName: inst.nombre, m: c.m, md: c.md, w: c.m ? '100%' : '420px', close,
      canEdit: c.edit, menuOpen: this.state.menu, toggleMenu: () => this.setState({ menu: !this.state.menu }),
      edit: () => c.open('P02e', { puesto: p.id }), deact: () => { close(); c.toast('Puesto desactivado', 'Deshacer'); },
      canAssign: c.assign && (missing || c.edit), primary: missing ? () => assign(!p.titular ? 'Titular' : 'Relevo') : () => c.open('P02e', { puesto: p.id }), primaryLabel, btnH: c.m ? '48px' : '40px',
      pairs, pairCols: c.m ? '1fr' : 'repeat(2,minmax(0,1fr))',
      origen: p.id === 'ca-d2' || p.id === 'ca-d1', onOrigen: () => c.toast('El cotizador se diseña aparte'),
      asig, tiras, tiraFoot: 'Del ' + d0.s + ' al ' + d1.s + (corr ? ' · 4 de trabajo · 4 libres · relevo desfasado 4 días' : ' · ' + p.rol), hist,
      verPauta: () => c.go({ s: 'P04', inst: inst.id, focus: p.id })
    };
  }
}
</script>
</body>
</html>
