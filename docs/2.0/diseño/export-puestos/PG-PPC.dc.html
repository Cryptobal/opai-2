<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/opai-design-system-00ba34e0-dc81-4559-9ac3-3ae7b680284c/colors_and_type.css">
<script src="_ds/opai-design-system-00ba34e0-dc81-4559-9ac3-3ae7b680284c/_ds_bundle.js"></script>
<script src="pg-data.js"></script>
<script src="pg-icons.js"></script>
</helmet>
<div style="display:flex;flex-direction:column;gap:16px;">
  <div style="display:grid;grid-template-columns:{{ kpiCols }};gap:12px;">
    <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
      <div style="border:1px solid hsl(var(--ds-border-default));border-radius:10px;background:hsl(var(--app-card));padding:12px 14px;display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:12px;color:hsl(var(--ds-text-3));">{{ k.l }}</span>
        <span style="font-family:var(--app-font-mono);font-size:24px;line-height:28px;font-weight:600;color:{{ k.fg }};">{{ k.v }}</span>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ showTabs }}">
    <div style="display:flex;gap:4px;border-bottom:1px solid hsl(var(--ds-border-default));">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
        <button onClick="{{ t.onClick }}" style="height:44px;padding:0 12px;border:0;border-bottom:2px solid {{ t.bd }};margin-bottom:-1px;background:transparent;color:{{ t.fg }};font-size:13px;font-weight:{{ t.fw }};cursor:pointer;display:flex;align-items:center;gap:6px;">{{ t.l }}<span style="font-family:var(--app-font-mono);font-size:11px;padding:0 6px;border-radius:999px;background:hsl(var(--app-muted));">{{ t.n }}</span></button>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ allCovered }}">
    <div style="border:1px dashed hsl(var(--ds-border-strong));border-radius:14px;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;">
      <pg-i name="check" size="22" style="color:hsl(var(--ds-ok-fg));"></pg-i>
      <span style="font-weight:600;">Todos los puestos están cubiertos hoy</span>
      <span style="font-size:13px;color:hsl(var(--ds-text-3));">Revisa los 11 PPC de los próximos 7 días.</span>
    </div>
  </sc-if>
  <div style="display:flex;flex-direction:column;gap:{{ gap }};border:{{ listBd }};border-radius:14px;background:{{ listBg }};">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:{{ dir }};align-items:{{ align }};gap:12px;padding:14px 16px;border:{{ cardBd }};border-bottom:1px solid hsl(var(--ds-border-subtle));border-radius:{{ cardRad }};background:hsl(var(--app-card));">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
          <span style="font-weight:600;">{{ r.title }}</span>
          <span style="font-size:13px;color:hsl(var(--ds-text-3));">{{ r.funcion }} · {{ r.turno }}<sc-if value="{{ r.mid }}"><span style="font-size:11px;margin-left:3px;">+1</span></sc-if></span>
          <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <span style="display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:500;background:{{ r.bbg }};color:{{ r.bfg }};"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>{{ r.badge }}</span>
            <span style="font-size:12px;color:hsl(var(--ds-text-3));">{{ r.inicio }}</span>
          </span>
          <span style="font-size:12px;color:hsl(var(--ds-text-2));text-wrap:pretty;">{{ r.quien }}</span>
        </div>
        <sc-if value="{{ r.actions }}">
          <div style="display:flex;gap:8px;flex-direction:{{ actDir }};flex:none;">
            <sc-if value="{{ canContact }}"><button onClick="{{ r.onUrg }}" style="height:{{ btnH }};padding:0 14px;border:0;border-radius:10px;background:hsl(var(--app-primary));color:hsl(var(--app-primary-fg));font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;"><pg-i name="search" size="16"></pg-i>Búsqueda de urgencia</button></sc-if>
            <button onClick="{{ r.onAssign }}" style="height:{{ btnH }};padding:0 14px;border:1px solid hsl(var(--ds-border-strong));border-radius:10px;background:transparent;color:hsl(var(--ds-text-1));font-weight:500;font-size:13px;cursor:pointer;">Asignar</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'open' };
  componentDidMount() { if (!window.PG) this.iv = setInterval(() => { if (window.PG) { clearInterval(this.iv); this.forceUpdate(); } }, 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const D = window.PG, c = this.props.ctx || {}, st = this.state;
    if (!D) return { kpis: [], tabs: [], filters: [], rows: [] };
    const sup = c.role === 'supervisor';
    const covered = (window.__pgCovered || []);
    const empty = c.st === 'empty';
    let open = D.ppcHoy.filter(p => !sup || p.inst !== 'Torre Costanera Oriente').filter(p => !covered.includes(p.id));
    let done = D.cubiertosHoy.concat(covered.map(id => ({ id, inst: 'Planta Quilicura', puesto: 'Control de acceso noche 1', funcion: 'Control de acceso', turno: '20:00–08:00', mid: true, badge: 'Cubierto · Reemplazo', quien: 'Felipe Araya · motivo original: Licencia' })));
    if (empty) { open = []; }
    const urg = p => () => c.open('P05b', { ppc: p.id, inst: p.inst === 'Planta Quilicura' ? 'quilicura' : p.inst === 'CD Pudahuel' ? 'pudahuel' : 'costanera' });
    const rowsOpen = open.map(p => ({ title: p.inst + ' · ' + p.puesto, funcion: p.funcion, turno: p.turno, mid: p.mid, badge: 'PPC · ' + p.motivo, bbg: 'hsl(var(--ds-danger-soft))', bfg: 'hsl(var(--ds-danger-fg))', inicio: p.inicio, quien: p.quien, actions: c.assign, onUrg: () => c.open('P05b', {}), onAssign: () => c.open('P03', { puesto: 'ca-n1', inst: 'quilicura' }) }));
    const rowsDone = done.map(p => ({ title: p.inst + ' · ' + p.puesto, funcion: p.funcion, turno: p.turno, mid: p.mid, badge: p.badge, bbg: 'hsl(var(--ds-info-soft))', bfg: 'hsl(var(--ds-info-fg))', inicio: '', quien: p.quien, actions: false }));
    const tab = empty ? 'open' : st.tab;
    const t = (k, l, n) => ({ l, n, onClick: () => this.setState({ tab: k }), fg: tab === k ? 'hsl(var(--ds-text-1))' : 'hsl(var(--ds-text-3))', bd: tab === k ? 'hsl(var(--ds-text-1))' : 'transparent', fw: tab === k ? 600 : 500 });
    const fl = l => ({ l, bd: 'hsl(var(--ds-border-default))', bg: 'transparent', fg: 'hsl(var(--ds-text-2))', onClick: () => c.toast('Filtro: ' + l) });
    const rows = tab === 'open' ? rowsOpen : rowsDone;
    const m = c.m;
    return {
      pad: m ? '16px 16px 32px' : '20px 24px 40px', goMes: () => c.go({ s: 'P04' }),
      kpis: [{ l: 'PPC hoy', v: String(open.length), fg: open.length ? 'hsl(var(--ds-danger-fg))' : 'hsl(var(--ds-text-1))' }, { l: 'Cubiertos hoy', v: String(done.length) }, { l: 'PPC próximos 7 días', v: '11' }].map(k => Object.assign({ fg: 'hsl(var(--ds-text-1))' }, k)),
      kpiCols: m && !c.landscape ? 'repeat(2,minmax(0,1fr))' : 'repeat(3,minmax(0,1fr))',
      showTabs: !empty, tabs: [t('open', 'Por cubrir', open.length), t('done', 'Cubiertos hoy', done.length)],
      filters: ['Instalación', 'Vertical', 'Motivo', 'Turno'].map(fl), allCovered: empty,
      rows, dir: m ? 'column' : 'row', align: m ? 'stretch' : 'center', actDir: m ? 'column' : 'row', btnH: m ? '48px' : '40px', canContact: c.contact,
      gap: m ? '12px' : '0', listBd: m ? '0' : '1px solid hsl(var(--ds-border-default))', listBg: m ? 'transparent' : 'hsl(var(--app-card))', cardBd: m ? '1px solid hsl(var(--ds-border-default))' : '0', cardRad: m ? '14px' : '0'
    };
  }
}
</script>
</body>
</html>
