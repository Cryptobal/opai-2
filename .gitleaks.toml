# Escaneo de secretos (job `secretos` de CI). Usa las reglas por defecto de gitleaks y excluye solo
# valores ficticios de tests y del build de CI, que no son secretos reales.
title = "OPAI 2.0"

[extend]
useDefault = true

[allowlist]
description = "Valores ficticios de tests y del build de CI"
regexes = [
  '''secreto-de-prueba-de-al-menos-32-caracteres''',
  '''ficticio-solo-para-build-de-ci-0+''',
  '''Clave-de-prueba-123''',
  # Token ficticio del test de la consola de correo (CAR-51): comprueba que se oculta en el log.
  '''Zx9aQ2bW7cE4dR1fT6gY3hU8''',
  # Valores ficticios de tests de Rondas PR 2 (#145): RONDAS_ETIQUETA_SECRET de prueba ya reemplazados
  # en el código vigente, pero siguen en el historial del commit ee401d40.
  '''secreto-de-prueba-rondas-etiqueta-32-bytes-o-mas''',
  '''otro-secreto-de-prueba-tambien-de-32-bytes-o-mas''',
]
